name: Workspace Verify

# 워크스페이스 전체의 타입체크와 테스트를 한 잡에서 돌린다. canary push에서 발화하고,
# stable-release가 릴리스 커밋을 만들기 전에 workflow_call로 같은 잡을 재사용한다 —
# 배포 파이프라인이 검증하는 기준과 개발 중 보는 기준을 하나로 묶기 위한 것이다.
# PR에서는 돌리지 않는다: 워크스페이스 전체 스위트는 머지 후 canary에서, 배포 직전
# 릴리스 파이프라인에서만 게이트로 쓴다.
# 문서·마크다운 변경만 있는 push는 검증이 필요 없으므로 건너뛴다. 단 fleet-admiral이
# postinstall에서 내장 자산으로 임베드하는 assets 하위의 SKILL.md·hook은 제외한다.
on:
  push:
    branches:
      - canary
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '!packages/fleet-admiral/assets/**'
  workflow_call:
    inputs:
      ref:
        description: 검증할 git ref/sha (미지정 시 이벤트 ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # postinstall이 워크스페이스 빌드를 수행하므로 --ignore-scripts를 쓰지 않는다.
      # 타입체크와 테스트 모두 dist를 참조하는 경로가 있어 빌드가 선행되어야 한다.
      - run: pnpm install --frozen-lockfile
      # 게이트는 검증 안에서 돌아야 게이트다 — 정의만 해 두면 새 위반이 그대로 통과한다.
      - name: Check localized user-facing attributes
        run: pnpm check:localized-attributes
      - name: Typecheck every workspace package
        run: pnpm typecheck
      - name: Test every workspace package
        run: pnpm test

  console-windows-lifecycle:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Fleet Console
        run: pnpm --filter @dotobokuri/fleet-console build
      # mock signal만 확인하면 Windows에서 남은 프로세스와 잠긴 파일을 놓친다.
      - name: Test Windows Console process lifecycle
        shell: pwsh
        run: |
          $env:FLEET_BUILT_SMOKE = "1"
          pnpm --filter @dotobokuri/fleet-console exec vitest run tests/built/fleet-built-smoke.test.ts tests/console-lifecycle.integration.test.ts
