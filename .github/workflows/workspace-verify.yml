name: Workspace Verify

# 워크스페이스 전체의 타입체크와 테스트를 한 잡에서 돌린다. canary를 겨눈 PR과 canary push
# 양쪽에서 발화하고, stable-release가 릴리스 커밋을 만들기 전에 workflow_call로 같은 잡을
# 재사용한다 — 배포 파이프라인이 검증하는 기준과 개발 중 보는 기준을 하나로 묶기 위한 것이다.
# PR에서 먼저 도는 것이 핵심이다: 머지 뒤 canary에서야 실패를 발견하면 그 실패는 이미
# 다른 작업의 기준선이 되어 있다.
# 문서·마크다운 변경만 있는 이벤트는 검증이 필요 없으므로 건너뛴다. 단 fleet-admiral이
# postinstall에서 내장 자산으로 임베드하는 assets 하위의 SKILL.md·hook은 제외한다.
on:
  pull_request:
    branches:
      - canary
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '!packages/fleet-admiral/assets/**'
  push:
    branches:
      - canary
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '!packages/fleet-admiral/assets/**'
  workflow_call:
    inputs:
      ref:
        description: 검증할 git ref/sha (미지정 시 이벤트 ref)
        required: false
        type: string

permissions:
  contents: read

# PR에 새 커밋이 오르면 앞선 실행은 이미 답이 아니다 — 취소해 러너를 비운다. 릴리스가
# workflow_call로 부르는 실행은 취소 대상이 아니다: 그쪽은 게이트이지 미리보기가 아니다.
concurrency:
  group: workspace-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # postinstall이 워크스페이스 빌드를 수행하므로 --ignore-scripts를 쓰지 않는다.
      # 타입체크와 테스트 모두 dist를 참조하는 경로가 있어 빌드가 선행되어야 한다.
      - run: pnpm install --frozen-lockfile
      # 게이트는 검증 안에서 돌아야 게이트다 — 정의만 해 두면 새 위반이 그대로 통과한다.
      - name: Check localized user-facing attributes
        run: pnpm check:localized-attributes
      - name: Typecheck every workspace package
        run: pnpm typecheck
      - name: Test every workspace package
        run: pnpm test
