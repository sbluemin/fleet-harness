# main push 이후 canary를 자동 ff sync합니다. divergent 시 fail-fast로 운영자가 인지하게 합니다.
name: Canary Sync

on:
  # main 일반 푸시에는 push 이벤트로 즉시 sync.
  push:
    branches:
      - main
  # auto-release 봇 커밋은 [skip ci]라 push 이벤트를 막으므로, Auto Release 완료를 별도로 감지해 sync한다.
  workflow_run:
    workflows: ["Auto Release"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: canary-sync-from-main
  cancel-in-progress: false

jobs:
  sync-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: canary
          # canary는 PR 필수 ruleset이 적용되므로 admin PAT로 인증해 bypass 한다.
          token: ${{ secrets.CANARY_SYNC_PAT }}

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Fast-forward canary
        run: git merge --ff-only origin/main

      - name: Push canary
        run: git push origin canary
