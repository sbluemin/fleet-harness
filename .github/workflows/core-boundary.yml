name: Core Boundary

on:
  pull_request:
  push:
    branches:
      - main
      - canary

jobs:
  core-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - run: pnpm check:core-boundary
