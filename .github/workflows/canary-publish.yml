name: Canary Publish

on:
  push:
    branches:
      - canary

concurrency:
  group: canary-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve canary version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "canary_version=${BASE_VERSION}-canary.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish fleet-wiki-web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY_VERSION: ${{ steps.version.outputs.canary_version }}
        run: node scripts/publish-fleet-wiki-web.mjs --tag=canary --version=$CANARY_VERSION

      - name: Publish fleet-agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY_VERSION: ${{ steps.version.outputs.canary_version }}
        run: node scripts/publish-fleet-agent.mjs --tag=canary --version=$CANARY_VERSION --wiki-web-version=$CANARY_VERSION
