name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target release version (semver, e.g. 1.0.0)'
        required: true
        type: string

# auto-release와 동일한 concurrency group — 동시 실행 방지.
concurrency:
  group: auto-release-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version format
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semver format: $INPUT_VERSION (expected X.Y.Z)"
            exit 1
          fi

      - name: Checkout canary
        uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0

      - name: Verify version is newer than current
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -n "$latest_tag" ]; then
            current="${latest_tag#v}"
          else
            current=$(node -p "require('./package.json').version")
          fi

          is_newer=$(node -e "
            const [cMaj, cMin, cPat] = process.argv[1].split('.').map(Number);
            const [nMaj, nMin, nPat] = process.argv[2].split('.').map(Number);
            const newer = nMaj > cMaj
              || (nMaj === cMaj && nMin > cMin)
              || (nMaj === cMaj && nMin === cMin && nPat > cPat);
            console.log(newer ? 'true' : 'false');
          " "$current" "$INPUT_VERSION")

          if [ "$is_newer" != "true" ]; then
            echo "::error::Version $INPUT_VERSION is not newer than current $current"
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Upgrading: $current → $INPUT_VERSION"

      - name: Verify tag does not exist
        env:
          TAG: v${{ inputs.version }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Update version and changelog
        env:
          NEXT_VERSION: ${{ inputs.version }}
        run: |
          # 루트 + 모든 워크스페이스 package.json의 version 필드를 동시에 갱신.
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const nextVersion = process.env.NEXT_VERSION;
          const tracked = execSync('git ls-files', { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean);
          const files = tracked.filter((f) => f === 'package.json' || f.endsWith('/package.json'));
          for (const file of files) {
            const raw = fs.readFileSync(file, 'utf8');
            const updated = raw.replace(/("version":\s*")[^"]+(")/, `$1${nextVersion}$2`);
            if (updated !== raw) {
              fs.writeFileSync(file, updated);
            }
          }
          NODE

          RELEASE_DATE=$(date -u +%F)
          export RELEASE_DATE

          node <<'NODE'
          const fs = require('fs');

          const changelogPath = 'CHANGELOG.md';
          const nextVersion = process.env.NEXT_VERSION;
          const releaseDate = process.env.RELEASE_DATE;
          const content = fs.readFileSync(changelogPath, 'utf8');
          const unreleasedHeader = '## [Unreleased]';
          const unreleasedIndex = content.indexOf(unreleasedHeader);

          if (unreleasedIndex === -1) {
            throw new Error('Missing [Unreleased] section in CHANGELOG.md');
          }

          const afterHeaderIndex = content.indexOf('\n', unreleasedIndex);
          if (afterHeaderIndex === -1) {
            throw new Error('Malformed [Unreleased] section in CHANGELOG.md');
          }

          const nextSectionIndex = content.indexOf('\n## [', afterHeaderIndex + 1);
          const unreleasedBody = content.slice(afterHeaderIndex + 1, nextSectionIndex === -1 ? content.length : nextSectionIndex);
          const trimmedBody = unreleasedBody.replace(/^\n+|\n+$/g, '');
          const releaseHeader = `## [${nextVersion}] - ${releaseDate}`;
          const releaseBody = trimmedBody.trim() ? trimmedBody : `Release v${nextVersion}`;
          const replacement = `${unreleasedHeader}\n\n${releaseHeader}\n\n${releaseBody}\n\n`;
          const updated = `${content.slice(0, unreleasedIndex)}${replacement}${nextSectionIndex === -1 ? '' : content.slice(nextSectionIndex + 1)}`;

          fs.writeFileSync(changelogPath, updated);
          NODE

      - name: Verify workspace version sync
        env:
          NEXT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const expected = process.env.NEXT_VERSION;
          const tracked = execSync('git ls-files', { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean);
          const files = tracked.filter((f) => f === 'package.json' || f.endsWith('/package.json'));
          const offenders = [];
          let checked = 0;
          for (const file of files) {
            let pkg;
            try {
              pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (err) {
              offenders.push(`${file} → parse error: ${err.message}`);
              continue;
            }
            if (typeof pkg.version !== 'string') {
              console.log(`skipped ${file}: no version field`);
              continue;
            }
            checked++;
            if (pkg.version !== expected) {
              offenders.push(`${file} → version=${pkg.version} (expected ${expected})`);
            }
          }
          if (offenders.length > 0) {
            console.error('Workspace version sync failed:');
            for (const line of offenders) console.error(`  ${line}`);
            process.exit(1);
          }
          console.log(`OK: ${checked} package.json file(s) synced to ${expected}`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish fleet-wiki-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEXT_VERSION: ${{ inputs.version }}
        run: node scripts/publish-fleet-wiki-ui.mjs --tag=canary --version=$NEXT_VERSION

      - name: Publish fleet-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NEXT_VERSION: ${{ inputs.version }}
        run: node scripts/publish-fleet-cli.mjs --tag=canary --version=$NEXT_VERSION --wiki-web-version=$NEXT_VERSION

      - name: Commit release changes
        env:
          NEXT_TAG: v${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git ls-files | grep -E '(^|/)package\.json$' | xargs git add
          git commit -m "chore(release): $NEXT_TAG"
          git push origin HEAD:canary

      - name: Sync release commit from canary
        run: |
          git fetch origin canary --tags
          git checkout -B canary origin/canary

      - name: Resolve release commit
        id: release
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          NEXT_TAG: v${{ inputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          if git rev-parse "refs/tags/$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists. Treating as success."
            exit 0
          fi
          git tag "$NEXT_TAG" "$RELEASE_SHA"
          git push origin "$NEXT_TAG"
