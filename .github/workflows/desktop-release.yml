name: Desktop Release

# stable-release.yml이 릴리스/태그를 만든 뒤 같은 런에서 호출한다(workflow_call).
# 셸은 GitHub Release에서 한 번 내려받는 정적 설치본이며 electron-updater를 쓰지 않는다.
# Console 갱신은 셸에 동봉하지 않고 런타임 조달 경로가 담당한다.
on:
  workflow_call:
    inputs:
      ref:
        description: 빌드할 릴리스 커밋의 git ref/sha (버전이 이미 bump된 상태)
        required: true
        type: string
      tag:
        description: 셸 설치본을 업로드할 릴리스 태그 (예 v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 빌드할 git ref (미지정 시 기본 브랜치)
        required: false
        type: string
      tag:
        description: 셸 설치본을 업로드할 기존 GitHub Release 태그
        required: true
        type: string

permissions:
  contents: write

jobs:
  # macOS arm64 — dmg/zip 셸 설치본만 초안 Release에 명시적으로 업로드한다.
  macos:
    name: macOS arm64
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build console protocol + desktop shell
        run: |
          pnpm --filter @dotobokuri/fleet-console build
          pnpm --filter @dotobokuri/fleet-console-desktop build
      - name: Package shell installers (mac arm64)
        env:
          # 시크릿이 있으면 electron-builder가 서명+노터라이즈, 없으면 unsigned로 빌드한다.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          pnpm --filter @dotobokuri/fleet-console-desktop exec electron-builder
          --mac --arm64 --publish never
      - name: Verify shell-only package
        run: pnpm --filter @dotobokuri/fleet-console-desktop verify:package
      - name: Upload shell installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(runtime/fleet-console-desktop/release/*.dmg runtime/fleet-console-desktop/release/*.zip)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No macOS shell installers were produced" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${artifacts[@]}" --clobber

  # Windows x64 — arm64는 지원하지 않는다(electron-builder의 arm64 NSIS가 malformed 설치본을 만든다).
  # Windows-on-ARM 사용자는 x64 빌드를 에뮬레이션으로 실행한다.
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build console protocol + desktop shell
        run: |
          pnpm --filter @dotobokuri/fleet-console build
          pnpm --filter @dotobokuri/fleet-console-desktop build
      - name: Package shell installer (nsis, ${{ matrix.arch }})
        shell: bash
        run: >-
          pnpm --filter @dotobokuri/fleet-console-desktop exec electron-builder
          --win --${{ matrix.arch }} --publish never
      - name: Verify shell-only package
        shell: bash
        run: pnpm --filter @dotobokuri/fleet-console-desktop verify:package
      - name: Locate installer
        id: art
        shell: bash
        run: |
          shopt -s nullglob
          installers=(runtime/fleet-console-desktop/release/Fleet\ Console-*-win-${{ matrix.arch }}.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one Windows shell installer, found ${#installers[@]}" >&2
            exit 1
          fi
          echo "exe=${installers[0]}" >> "$GITHUB_OUTPUT"

      # SignPath는 GitHub Actions 아티팩트로 업로드된 설치본만 서명한다.
      - name: Upload unsigned installer for SignPath
        id: unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-win-${{ matrix.arch }}
          path: ${{ steps.art.outputs.exe }}
          if-no-files-found: error

      - name: Sign installer with SignPath
        id: signpath
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 무료 등급은 릴리스마다 수동 승인이 필요하므로 넉넉히 대기(기본 600초 → 30분).
          wait-for-completion-timeout-in-seconds: '1800'
          # 단일 exe이므로 압축 해제 없이 원본 파일명으로 내려받는다.
          skip-decompress: true
          output-artifact-directory: runtime/fleet-console-desktop/release

      - name: Upload shell installer to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ inputs.tag }}" "${{ steps.art.outputs.exe }}" --clobber
