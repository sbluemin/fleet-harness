name: Desktop Release

# stable-release.yml이 릴리스/태그를 만든 뒤 같은 런에서 호출한다(workflow_call).
# 셸은 GitHub Release를 갱신 소스로 삼아 electron-updater로 자기 자신을 갱신한다 — 설치본과 함께
# 갱신 메타데이터(latest*.yml)를 같은 태그에 올려야 그 경로가 성립한다.
# Console 갱신은 셸에 동봉하지 않고 런타임 조달 경로가 담당한다(버전도 서로 독립이다).
on:
  workflow_call:
    inputs:
      ref:
        description: 빌드할 릴리스 커밋의 git ref/sha (버전이 이미 bump된 상태)
        required: true
        type: string
      tag:
        description: 셸 설치본을 업로드할 릴리스 태그 (예 v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 빌드할 git ref (미지정 시 기본 브랜치)
        required: false
        type: string
      tag:
        description: 셸 설치본을 업로드할 기존 GitHub Release 태그
        required: true
        type: string

permissions:
  contents: write

jobs:
  # macOS arm64 — dmg/zip 셸 설치본만 초안 Release에 명시적으로 업로드한다.
  macos:
    name: macOS arm64
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build console protocol + desktop shell
        run: |
          pnpm --filter @dotobokuri/core-process build
          pnpm --filter @dotobokuri/fleet-console build
          pnpm --filter @dotobokuri/fleet-desktop build
      - name: Package shell installers (mac arm64)
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FLEET_DESKTOP_TARGET: darwin-arm64
        run: |
          FLEET_DESKTOP_RELEASE=1 pnpm --filter @dotobokuri/fleet-desktop run prepackage:release
          pnpm --filter @dotobokuri/fleet-desktop exec electron-builder --mac --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=true
      - name: Verify shell-only package
        env:
          FLEET_DESKTOP_RELEASE: '1'
          FLEET_DESKTOP_TARGET: darwin-arm64
        run: pnpm --filter @dotobokuri/fleet-desktop run verify:package --release
      - name: Upload shell installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(runtime/fleet-desktop/release/*.dmg runtime/fleet-desktop/release/*.zip)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No macOS shell installers were produced" >&2
            exit 1
          fi
          # 갱신 메타데이터와 blockmap은 설치본과 같은 릴리스에 함께 있어야 한다 — electron-updater는
          # latest 릴리스의 자산에서 latest-mac.yml을 읽고, 거기에 적힌 이름을 같은 태그에서 내려받는다.
          if [ ! -f runtime/fleet-desktop/release/latest-mac.yml ]; then
            echo "latest-mac.yml is missing — the shell cannot update itself without it" >&2
            exit 1
          fi
          artifacts+=(runtime/fleet-desktop/release/latest-mac.yml runtime/fleet-desktop/release/*.blockmap)
          gh release upload "${{ inputs.tag }}" "${artifacts[@]}" --clobber

  # Windows x64 — arm64는 지원하지 않는다(electron-builder의 arm64 NSIS가 malformed 설치본을 만든다).
  # Windows-on-ARM 사용자는 x64 빌드를 에뮬레이션으로 실행한다.
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build console protocol + desktop shell
        run: |
          pnpm --filter @dotobokuri/core-process build
          pnpm --filter @dotobokuri/fleet-console build
          pnpm --filter @dotobokuri/fleet-desktop build
      - name: Package shell installer (nsis, ${{ matrix.arch }})
        shell: bash
        run: >-
          pnpm --filter @dotobokuri/fleet-desktop exec electron-builder
          --win --${{ matrix.arch }} --publish never
      - name: Verify shell-only package
        shell: bash
        run: pnpm --filter @dotobokuri/fleet-desktop verify:package
      - name: Locate installer
        id: art
        shell: bash
        run: |
          shopt -s nullglob
          installers=(runtime/fleet-desktop/release/Fleet-Console-*-win-${{ matrix.arch }}.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one Windows shell installer, found ${#installers[@]}" >&2
            exit 1
          fi
          echo "exe=${installers[0]}" >> "$GITHUB_OUTPUT"

      # Windows 설치본은 서명하지 않는다. 설치본을 나중에 바꿔 쓰는 어떤 단계도 둘 수 없다 —
      # latest.yml에 적힌 해시는 여기서 만들어진 그 파일의 것이고, 파일이 교체되면 갱신이 무결성 검사에서 막힌다.
      - name: Upload shell installer to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f runtime/fleet-desktop/release/latest.yml ]; then
            echo "latest.yml is missing — the shell cannot update itself without it" >&2
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" \
            "${{ steps.art.outputs.exe }}" \
            runtime/fleet-desktop/release/latest.yml --clobber
