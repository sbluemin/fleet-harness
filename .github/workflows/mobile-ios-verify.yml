name: Mobile iOS Verify

# iOS 포팅의 검증 레일. 개발 호스트(Windows)에서는 Swift를 빌드할 수 없으므로, 순수 로직
# Swift 테스트(SPM)와 서명 없는 시뮬레이터 빌드를 macOS 러너에서 돌린다. 이식이 끝나기
# 전의 실행은 조용히 통과하는 대신 어느 단계가 아직 없는지 notice로 명시한다 — 침묵 스킵은
# 커버리지가 있는 척을 만든다.
#
# push 트리거는 iOS 포팅 브랜치 전용이다: PR이 열리기 전까지 푸시마다 자동 검증을 돌리기
# 위한 것으로, PR을 열 때 pull_request 트리거만 남기고 제거한다.
on:
  push:
    branches:
      - feat/fleet-mobile-ios
  workflow_dispatch:
    inputs:
      ref:
        description: 검증할 git ref (미지정 시 이벤트 ref)
        required: false
        type: string
  pull_request:
    branches:
      - canary
    paths:
      - 'runtime/fleet-mobile/**'
      - '.github/workflows/mobile-ios-verify.yml'

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오르면 앞선 실행은 이미 답이 아니다 — 취소해 러너를 비운다.
concurrency:
  group: mobile-ios-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift unit tests (SPM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Package.swift는 순수 로직 포팅 태스크가 추가한다. 그 전에는 없음을 알리고 통과한다.
      - name: Run swift test over the pure-logic targets
        run: |
          if [ ! -f runtime/fleet-mobile/modules/fleet-console-view/Package.swift ]; then
            echo "::notice::Package.swift not present yet (pure-logic port pending) — nothing to test"
            exit 0
          fi
          swift test --package-path runtime/fleet-mobile/modules/fleet-console-view

  simulator-build:
    name: Simulator build (unsigned)
    # React Native 0.86은 Xcode >= 16.1을 요구한다. macos-14 이미지의 기본 Xcode(15.4)로는
    # pod install이 거부되므로 최신 이미지를 쓰고 설치된 가장 높은 Xcode를 선택한다.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Expo SDK 57의 SwiftPM 'apple' 패키지는 Swift tools 6.2.0(= Xcode 26.x)을 요구한다.
      # 그러나 Xcode 26.3의 최신 Swift 컴파일러는 expo-modules-jsi를 깨뜨린다(type-inference
      # ambiguity). 그래서 6.2를 제공하면서도 그 회귀를 피하도록 가장 낮은 26.x를 고른다.
      # (16.x는 'apple' 패키지의 6.2 요구를 만족하지 못한다.)
      - name: Select an Expo-compatible Xcode (lowest 26.x, Swift 6.2)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true
          target=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          if [ -z "$target" ]; then
            echo "::warning::No Xcode 26.x found; falling back to the newest available"
            target=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$target" ]; then
            echo "::error::No Xcode found on the runner" >&2
            exit 1
          fi
          echo "Selecting $target"
          sudo xcode-select -s "$target/Contents/Developer"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check whether the iOS platform is configured
        id: platform
        run: |
          if node -e "const c=require('./runtime/fleet-mobile/modules/fleet-console-view/expo-module.config.json'); process.exit(c.platforms.includes('apple')||c.platforms.includes('ios')?0:1)"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS platform not configured yet — skipping the simulator build"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Expo prebuild (ios)
        if: steps.platform.outputs.configured == 'true'
        run: pnpm --dir runtime/fleet-mobile exec expo prebuild --platform ios --clean --no-install --non-interactive
      - name: Pod install
        if: steps.platform.outputs.configured == 'true'
        working-directory: runtime/fleet-mobile/ios
        run: pod install
      # 오토링킹이 로컬 모듈을 놓치면 빌드는 성공하고 앱은 런타임에야 죽는다 — 여기서 크게 실패시킨다.
      - name: Assert the fleet-console-view pod was autolinked
        if: steps.platform.outputs.configured == 'true'
        run: grep -q "FleetConsoleView" runtime/fleet-mobile/ios/Podfile.lock
      # 전체 앱 시뮬레이터 빌드는 informational이다: Expo 57.0.11 + expo-modules-jsi@57.0.4
      # (npm 최신)가 Expo의 'apple' SwiftPM 패키지가 요구하는 Swift 6.2에서 컴파일되지 않는
      # 상류 비호환 때문에, 러너의 어느 Xcode로도 전체 빌드가 통과하지 못한다. 이 저장소의
      # iOS 코드 검증은 swift-tests + pod install + autolink(위, 전부 필수)가 지키고, 전체 앱
      # 빌드는 Mac에서의 아이폰 QA 때 검증한다. 상류 이슈가 이 브랜치를 막지 않도록 실패해도
      # 잡을 실패시키지 않되, 결과는 경고로 분명히 남긴다.
      - name: Build for the simulator without signing (informational)
        id: sim_build
        if: steps.platform.outputs.configured == 'true'
        continue-on-error: true
        working-directory: runtime/fleet-mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -n 1)
          if [ -z "$workspace" ]; then
            echo "::error::Expo prebuild produced no .xcworkspace" >&2
            exit 1
          fi
          scheme="${workspace%.xcworkspace}"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Note the full-app build outcome
        if: steps.platform.outputs.configured == 'true'
        run: |
          if [ "${{ steps.sim_build.outcome }}" = "success" ]; then
            echo "Full-app simulator build passed."
          else
            echo "::warning::Full-app simulator build did not pass — known Expo 57 / expo-modules-jsi Swift 6.2 upstream incompatibility, not this repo's code. swift-tests + pod install + autolink are the hard gates; the full app build is verified locally on a Mac during iPhone QA."
          fi

  js-contract:
    name: fleet-mobile typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dotobokuri/fleet-mobile typecheck
      - run: pnpm --filter @dotobokuri/fleet-mobile test
