name: Mobile iOS Verify

# iOS 포팅의 검증 레일. 개발 호스트(Windows)에서는 Swift를 빌드할 수 없으므로, 순수 로직
# Swift 테스트(SPM)와 서명 없는 시뮬레이터 빌드를 macOS 러너에서 돌린다. 이식이 끝나기
# 전의 실행은 조용히 통과하는 대신 어느 단계가 아직 없는지 notice로 명시한다 — 침묵 스킵은
# 커버리지가 있는 척을 만든다.
#
# push 트리거는 iOS 포팅 브랜치 전용이다: PR이 열리기 전까지 푸시마다 자동 검증을 돌리기
# 위한 것으로, PR을 열 때 pull_request 트리거만 남기고 제거한다.
on:
  push:
    branches:
      - feat/fleet-mobile-ios
  workflow_dispatch:
    inputs:
      ref:
        description: 검증할 git ref (미지정 시 이벤트 ref)
        required: false
        type: string
  pull_request:
    branches:
      - canary
    paths:
      - 'runtime/fleet-mobile/**'
      - '.github/workflows/mobile-ios-verify.yml'

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오르면 앞선 실행은 이미 답이 아니다 — 취소해 러너를 비운다.
concurrency:
  group: mobile-ios-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift unit tests (SPM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Package.swift는 순수 로직 포팅 태스크가 추가한다. 그 전에는 없음을 알리고 통과한다.
      - name: Run swift test over the pure-logic targets
        run: |
          if [ ! -f runtime/fleet-mobile/modules/fleet-console-view/Package.swift ]; then
            echo "::notice::Package.swift not present yet (pure-logic port pending) — nothing to test"
            exit 0
          fi
          swift test --package-path runtime/fleet-mobile/modules/fleet-console-view

  simulator-build:
    name: Simulator build (unsigned)
    # React Native 0.86은 Xcode >= 16.1을 요구한다. macos-14 이미지의 기본 Xcode(15.4)로는
    # pod install이 거부되므로 최신 이미지를 쓰고 설치된 가장 높은 Xcode를 선택한다.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Expo SDK 57의 SwiftPM 'apple' 패키지는 Swift tools 6.2.0(= Xcode 26.x)을 요구한다.
      # 그러나 Xcode 26.3의 최신 Swift 컴파일러는 expo-modules-jsi를 깨뜨린다(type-inference
      # ambiguity). 그래서 6.2를 제공하면서도 그 회귀를 피하도록 가장 낮은 26.x를 고른다.
      # (16.x는 'apple' 패키지의 6.2 요구를 만족하지 못한다.)
      - name: Select an Expo-compatible Xcode (lowest 26.x, Swift 6.2)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app 2>/dev/null || true
          target=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          if [ -z "$target" ]; then
            echo "::warning::No Xcode 26.x found; falling back to the newest available"
            target=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$target" ]; then
            echo "::error::No Xcode found on the runner" >&2
            exit 1
          fi
          echo "Selecting $target"
          sudo xcode-select -s "$target/Contents/Developer"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check whether the iOS platform is configured
        id: platform
        run: |
          if node -e "const c=require('./runtime/fleet-mobile/modules/fleet-console-view/expo-module.config.json'); process.exit(c.platforms.includes('apple')||c.platforms.includes('ios')?0:1)"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::iOS platform not configured yet — skipping the simulator build"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Expo prebuild (ios)
        if: steps.platform.outputs.configured == 'true'
        run: pnpm --dir runtime/fleet-mobile exec expo prebuild --platform ios --clean --no-install --non-interactive
      - name: Pod install
        if: steps.platform.outputs.configured == 'true'
        working-directory: runtime/fleet-mobile/ios
        run: pod install
      # 오토링킹이 로컬 모듈을 놓치면 빌드는 성공하고 앱은 런타임에야 죽는다 — 여기서 크게 실패시킨다.
      - name: Assert the fleet-console-view pod was autolinked
        if: steps.platform.outputs.configured == 'true'
        run: grep -q "FleetConsoleView" runtime/fleet-mobile/ios/Podfile.lock
      # Expo 57의 Swift 6.2 비호환은 patches/expo-modules-jsi@57.0.4.patch가 해결하므로
      # 전체 앱 빌드는 다시 하드 게이트다 — 이 스텝이 깨지면 앱은 어디서도 빌드되지 않는다.
      #
      # 서명을 끄지 않고 ad-hoc(-)으로 서명한다. CODE_SIGNING_ALLOWED=NO로 만든 앱은
      # 엔타이틀먼트가 전혀 없어 application-identifier가 빠지고, 그러면 키체인 접근이
      # errSecMissingEntitlement(-34018)로 거부된다 — 로컬 TLS identity를 만들지 못해
      # 페어링이 게이트웨이 단계에서 죽는다. 시뮬레이터는 프로파일이 필요 없으므로 ad-hoc
      # 서명만으로 실제 기기 빌드와 같은 엔타이틀먼트 구조를 얻는다.
      - name: Build for the simulator without signing
        if: steps.platform.outputs.configured == 'true'
        working-directory: runtime/fleet-mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -n 1)
          if [ -z "$workspace" ]; then
            echo "::error::Expo prebuild produced no .xcworkspace" >&2
            exit 1
          fi
          scheme="${workspace%.xcworkspace}"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            build

      # 빌드된 시뮬레이터 앱을 그대로 내려받을 수 있게 올린다. Xcode 26 툴체인을 설치할 수
      # 없는 Mac(회사/공용 기기)에서도 `xcrun simctl install`로 실행해 볼 수 있는 경로다 —
      # 배포 타깃이 iOS 15.1이라 최신 시뮬레이터 런타임이 없어도 돈다. Release로 빌드해야
      # JS 번들이 앱 안에 들어가 Metro 없이 실행된다.
      - name: Package the simulator app for download
        if: steps.platform.outputs.configured == 'true'
        working-directory: runtime/fleet-mobile/ios
        run: |
          app=$(ls -d build/Build/Products/Release-iphonesimulator/*.app 2>/dev/null | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::simulator build produced no .app" >&2
            exit 1
          fi
          # ad-hoc 서명만으로는 application-identifier가 붙지 않는다 — 그 엔타이틀먼트는
          # 원래 프로비저닝 프로파일(기기)이나 팀 설정에서 나온다. 시뮬레이터는 프로파일을
          # 검증하지 않으므로, 기기 빌드가 갖게 될 것과 같은 모양의 엔타이틀먼트를 주입해
          # 앱 번들만 재서명한다. 이게 없으면 키체인이 -34018로 거부하고 페어링이 죽는다.
          cat > "$RUNNER_TEMP/simulator.entitlements" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>SIMULATOR.com.dotobokuri.fleet.mobile</string>
            <key>keychain-access-groups</key><array><string>SIMULATOR.com.dotobokuri.fleet.mobile</string></array>
          </dict></plist>
          PLIST
          codesign --force --sign - --entitlements "$RUNNER_TEMP/simulator.entitlements" "$app"
          if [ ! -f "$app/main.jsbundle" ]; then
            echo "::error::the packaged app has no embedded main.jsbundle — it would need Metro to run" >&2
            exit 1
          fi
          # 엔타이틀먼트가 없으면 앱은 실행되지만 키체인 접근이 -34018로 거부되고, 페어링이
          # 게이트웨이 단계에서 죽는다. 실행 가능해 보이는 무용지물을 올리지 않도록 검사한다.
          if ! codesign -d --entitlements :- --xml "$app" 2>/dev/null | grep -q "application-identifier"; then
            echo "::error::the packaged app carries no application-identifier entitlement — keychain access would fail at runtime" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/fleet-simulator-app.zip"
          echo "packaged $app"
      - uses: actions/upload-artifact@v4
        if: steps.platform.outputs.configured == 'true'
        with:
          name: fleet-ios-simulator-app
          path: ${{ runner.temp }}/fleet-simulator-app.zip
          retention-days: 14

  js-contract:
    name: fleet-mobile typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dotobokuri/fleet-mobile typecheck
      - run: pnpm --filter @dotobokuri/fleet-mobile test
