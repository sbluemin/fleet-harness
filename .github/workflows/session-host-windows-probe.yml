name: Session Host Windows Probe

# Temporary, branch-only probe for objective 86fc3ff0 (session host kept across Console updates).
# The person asked for no canary merge, and Windows CI was removed from the permanent suite on 2026-10-16,
# so this file lives only on feat/session-keep. Delete it before this branch is ever proposed for canary.
on:
  push:
    branches:
      - feat/session-keep

permissions:
  contents: read

jobs:
  session-host-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleet-console/agent-runtime build
      - run: pnpm --filter @dotobokuri/fleet-console build
      # Run the native boundary outside Vitest so a native crash has its own step/exit code.
      - name: Native SID and ACL preflight
        run: |
          T=$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/fleet-native-probe-XXXXXX")
          trap 'rm -rf -- "$T"' EXIT; trap 'exit 130' INT; trap 'exit 143' TERM; trap 'exit 129' HUP
          mkdir -p "$T/native" "$T/home"
          export FLEET_NATIVE_PROBE_DIR="$(cygpath -w "$T/native")"
          export HOME="$(cygpath -w "$T/home")"
          export USERPROFILE="$HOME"
          pnpm --filter @dotobokuri/fleet-console exec node --import tsx --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createWindowsSessionPlatform } from './core/host/bootstrap/windows-session-platform.ts';
          console.log('native-preflight: starting');
          const { createRequire } = await import('node:module');
          const koffi = createRequire(import.meta.url)('koffi'); const kernel = koffi.load('kernel32.dll');
          const current = kernel.func('__stdcall', 'GetCurrentProcess', 'void *', []);
          const inJob = kernel.func('__stdcall', 'IsProcessInJob', 'int', ['void *', 'void *', koffi.pointer('uint8')]);
          const query = kernel.func('__stdcall', 'QueryInformationJobObject', 'int', ['void *', 'int', koffi.pointer('uint8'), 'uint32', 'void *']);
          const member = Buffer.alloc(4); const limits = Buffer.alloc(144);
          if (!inJob(current(), null, member)) throw new Error('probe_job_query_failed');
          const queried = query(null, 9, limits, limits.length, null); const flags = queried ? limits.readUInt32LE(16) : null;
          console.log(JSON.stringify({ stage: 'runner-job', inJob: member.readUInt32LE(0) !== 0, flags, breakaway: flags === null ? null : Boolean(flags & 0x800), silentBreakaway: flags === null ? null : Boolean(flags & 0x1000) }));
          const platform = createWindowsSessionPlatform();
          if (!platform) throw new Error('windows_platform_missing');
          console.log('native-preflight: token SID decoded');
          const directory = process.env.FLEET_NATIVE_PROBE_DIR;
          platform.protectDirectory(directory);
          const file = path.join(directory, 'owned'); fs.writeFileSync(file, 'fixture');
          if (!platform.owns(directory) || !platform.owns(file)) throw new Error('native_owner_unverified');
          console.log('native-preflight: user/SYSTEM DACL and current-token ownership verified');
          JS
      # A restrictive runner job proves normal execution/cleanup, not preservation.
      - name: Console-owned fallback inside the runner job
        run: |
          set -o pipefail
          FORCE_COLOR=0 pnpm --filter @dotobokuri/fleet-console exec vitest run tests/console-lifecycle.integration.test.ts --reporter=verbose -t "runs Console-owned sessions" 2>&1 | tee session-host.log
          grep -E "Tests +[0-9]+ passed" session-host.log
          passed=$(grep -oE "Tests +[0-9]+ passed" session-host.log | grep -oE "[0-9]+" | head -1)
          test "${passed:-0}" -ge 1
      # Keep every preservation/authentication/job-zero assertion; run the driver outside the CI-owned job.
      - name: Session host representative cases outside the runner job
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/session-host-windows-outside-job.ps1
