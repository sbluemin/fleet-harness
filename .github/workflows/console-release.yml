name: Console Release

# stable-release.yml이 릴리스 커밋을 만든 뒤 호출한다. 릴리스 ref를 checkout해
# @dotobokuri/fleet-console를 npm에 배포한다. publish 스크립트는 멱등이라
# (이미 배포된 버전이면 dist-tag만 추가) 재실행해도 안전하다.
on:
  workflow_call:
    inputs:
      ref:
        description: 배포할 릴리스 커밋의 git ref/sha (버전 bump 완료 상태)
        required: true
        type: string
      version:
        description: 배포 버전 (예 1.23.1)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag
        required: false
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
      version:
        required: true
        type: string
      dist_tag:
        required: false
        type: string
        default: latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Publish @dotobokuri/fleet-console
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-fleet-console.mjs --tag=${{ inputs.dist_tag }} --version=${{ inputs.version }}
