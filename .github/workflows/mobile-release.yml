name: Mobile Release

# stable-release.yml이 릴리스 커밋을 만든 뒤 같은 런에서 호출한다(workflow_call).
# 산출물은 GitHub Release에 붙지 않는다. 릴리스 서명 APK는 Firebase App Distribution으로만 나가며,
# 받는 사람은 테스터 그룹에 등록된 계정뿐이다.
on:
  workflow_call:
    inputs:
      ref:
        description: 빌드할 릴리스 커밋의 git ref/sha (app.json 버전이 이미 bump된 상태)
        required: true
        type: string
  # 수동 실행에는 ref 입력을 두지 않는다. GitHub은 "Use workflow from"에서 고른 브랜치의
  # 워크플로 파일을 실행하므로, ref만 채우고 드롭다운을 기본 브랜치로 두면 그 브랜치의
  # 워크플로(= iOS 잡이 없는 버전)가 돌아 아무것도 배포되지 않는다. 입력을 없애면
  # "Use workflow from"이 유일한 선택지가 되고 체크아웃도 그 브랜치를 따른다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    name: Build and distribute Android
    # iOS 잡과 대칭인 게이트. 릴리스 경로(stable-release)는 이 변수가 true일 때만 여기까지
    # 오므로 no-op이고, 수동 dispatch로 iOS만 시험할 때 Android 잡이 키스토어 없이 돌다가
    # 런 전체를 빨갛게 만드는 것을 막는다.
    if: ${{ vars.FLEET_MOBILE_DISTRIBUTION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # resolveJavaHome()은 CI에서 JAVA_HOME을 쓴다(macOS 로컬에서만 Android Studio 번들 JDK를 찾는다).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned Android platform and build-tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile

      # 서명 자료는 파일로만 존재하고 저장소에는 들어가지 않는다. 러너는 일회용이므로 작업 디렉터리
      # 밖(RUNNER_TEMP)에 쓰고 경로만 빌드에 넘긴다.
      - name: Materialize the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLEET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FLEET_ANDROID_KEYSTORE_BASE64 is not set; a release cannot be signed" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build and verify the release APK
        env:
          FLEET_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          FLEET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FLEET_ANDROID_KEYSTORE_PASSWORD }}
          FLEET_ANDROID_KEY_ALIAS: ${{ secrets.FLEET_ANDROID_KEY_ALIAS }}
          FLEET_ANDROID_KEY_PASSWORD: ${{ secrets.FLEET_ANDROID_KEY_PASSWORD }}
        run: pnpm --filter @dotobokuri/fleet-mobile android:build:release

      # CI는 `firebase login`을 밟을 수 없으므로 서비스 계정으로 인증한다.
      - name: Distribute to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          RELEASE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set; the CLI cannot authenticate" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          pnpm --filter @dotobokuri/fleet-mobile android:distribute -- \
            --notes "$(git log -1 --format=%s "$RELEASE_SHA")"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-service-account.json"

  distribute-ios:
    name: Build and distribute iOS (TestFlight)
    # iOS 배포는 레포 변수 FLEET_MOBILE_IOS_DISTRIBUTION == 'true'일 때만 돈다(Android의
    # FLEET_MOBILE_DISTRIBUTION과 대칭). 변수가 없으면 잡 전체를 건너뛰어, 시크릿 등록 전에도
    # 브랜치가 막히지 않는다.
    if: ${{ vars.FLEET_MOBILE_IOS_DISTRIBUTION == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Expo 57의 SwiftPM 'apple' 패키지는 Swift 6.2(Xcode 26.x)를 요구한다. 가장 낮은 26.x를
      # 고른다(mobile-ios-verify.yml과 동일 근거).
      - name: Select an Expo-compatible Xcode (lowest 26.x, Swift 6.2)
        run: |
          target=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1)
          if [ -z "$target" ]; then target=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$target" ]; then echo "::error::No Xcode found on the runner" >&2; exit 1; fi
          echo "DEVELOPER_DIR=$target/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$target/Contents/Developer"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 여섯 개 Apple 시크릿은 전부-또는-전무다. 부분 설정은 서명되지 않은/개발-서명 IPA를
      # 만들지 않도록 하드 실패시킨다(desktop-release.yml의 all-or-none 서명 게이트와 동형).
      - name: Check the Apple signing secrets are complete
        env:
          CERT: ${{ secrets.FLEET_IOS_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.FLEET_IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.FLEET_IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.FLEET_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FLEET_ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.FLEET_ASC_KEY_BASE64 }}
        run: |
          missing=""
          for v in CERT CERT_PW PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::FLEET_MOBILE_IOS_DISTRIBUTION is true but these Apple secrets are missing:$missing. Set all six (certificate, password, profile, ASC key id/issuer/key) or unset the variable." >&2
            exit 1
          fi

      # 서명 자재는 파일로만 존재하고 저장소에는 들어가지 않는다. 러너 밖(RUNNER_TEMP/키체인)에
      # 쓰고 always()에서 지운다.
      - name: Materialize the Apple signing material
        env:
          CERT: ${{ secrets.FLEET_IOS_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.FLEET_IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.FLEET_IOS_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.FLEET_ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.FLEET_ASC_KEY_ID }}
        run: |
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          KEYCHAIN="$RUNNER_TEMP/fleet-signing.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          echo "FLEET_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build and verify the release IPA
        env:
          FLEET_IOS_CERTIFICATE_BASE64: ${{ secrets.FLEET_IOS_CERTIFICATE_BASE64 }}
          FLEET_IOS_CERTIFICATE_PASSWORD: ${{ secrets.FLEET_IOS_CERTIFICATE_PASSWORD }}
          FLEET_IOS_PROFILE_BASE64: ${{ secrets.FLEET_IOS_PROFILE_BASE64 }}
          FLEET_IOS_PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
        run: pnpm --filter @dotobokuri/fleet-mobile ios:build:release

      - name: Distribute to TestFlight
        env:
          FLEET_ASC_KEY_ID: ${{ secrets.FLEET_ASC_KEY_ID }}
          FLEET_ASC_ISSUER_ID: ${{ secrets.FLEET_ASC_ISSUER_ID }}
          FLEET_ASC_KEY_BASE64: ${{ secrets.FLEET_ASC_KEY_BASE64 }}
          FLEET_ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.FLEET_ASC_KEY_ID }}.p8
        run: pnpm --filter @dotobokuri/fleet-mobile ios:distribute

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$FLEET_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
