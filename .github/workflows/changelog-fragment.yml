name: Changelog Fragment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelog fragment rules
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          merge_base=$(git merge-base "$BASE_REF" "$HEAD_REF")
          # CLAUDE.md (and a leftover AGENTS.md) live in .changelog.d/ but are doctrine, not fragments.
          fragment_filter() { grep -E '^\.changelog\.d/[^/]+\.md$' | grep -vE '^\.changelog\.d/(AGENTS|CLAUDE)\.md$' || true; }
          fragment_files=$(git diff --name-only --diff-filter=A "$merge_base" "$HEAD_REF" | fragment_filter)
          if node -e "const labels = JSON.parse(process.env.LABELS_JSON); process.exit(labels.some((label) => label.name === 'no-changelog') ? 0 : 1);"; then
            has_no_changelog=true
          else
            has_no_changelog=false
          fi
          # Doctrine requires a correction to an unreleased change to be folded into that change's pending
          # fragment (.changelog.d/CLAUDE.md, Release Baseline). Blanket protection would make that impossible,
          # so an amendment is allowed when it is declared twice over: the label states the intent, and one
          # Changelog-Amend line per fragment names exactly which note is being rewritten. An accidental edit
          # still fails, because it names nothing.
          if node -e "const labels = JSON.parse(process.env.LABELS_JSON); process.exit(labels.some((label) => label.name === 'changelog-amend') ? 0 : 1);"; then
            has_changelog_amend=true
          else
            has_changelog_amend=false
          fi
          declared_amendments=$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | sed -n 's/^Changelog-Amend:[[:space:]]*//p' | sed 's/[[:space:]]*$//' | grep -v '^$' || true)
          # Withdrawing an unreleased feature leaves its pending note describing nothing, and a note cannot be
          # emptied. Removal is declared the same way as an amendment, under the same label, with its own line.
          declared_removals=$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | sed -n 's/^Changelog-Remove:[[:space:]]*//p' | sed 's/[[:space:]]*$//' | grep -v '^$' || true)

          # Every fragment already on the base branch belongs to another change that has not been released yet.
          # This PR must leave all of them byte-identical unless it declares an amendment: an undeclared edit
          # overwrites another branch's release note (two branch names can slug to one filename), and a delete or
          # rename removes it outright. Compare each base fragment across the range rather than filtering by
          # change type, so M, D and R are all caught.
          base_fragments=$(git ls-tree -r --name-only "$merge_base" -- .changelog.d | fragment_filter)
          disturbed=""
          amended=""
          removed=""
          while IFS= read -r fragment; do
            [ -n "$fragment" ] || continue
            git diff --quiet "$merge_base" "$HEAD_REF" -- "$fragment" && continue
            # An amendment rewrites a note; it never removes one. Requiring the path to still exist at HEAD keeps
            # deletes and renames on the failing path even when the file is declared as amended.
            if [ "$has_changelog_amend" = "true" ] \
              && git cat-file -e "$HEAD_REF:$fragment" 2>/dev/null \
              && printf '%s\n' "$declared_amendments" | grep -Fxq "${fragment#.changelog.d/}"; then
              amended="${amended}${fragment}"$'\n'
              continue
            fi
            # A removal is the only declared way to delete a note, and only a note that is actually gone at HEAD.
            # canary.md aggregates several direct-canary changes, so it is never removable as one feature's note.
            if [ "$has_changelog_amend" = "true" ] \
              && [ "$fragment" != ".changelog.d/canary.md" ] \
              && ! git cat-file -e "$HEAD_REF:$fragment" 2>/dev/null \
              && printf '%s\n' "$declared_removals" | grep -Fxq "${fragment#.changelog.d/}"; then
              removed="${removed}${fragment}"$'\n'
              continue
            fi
            disturbed="${disturbed}${fragment}"$'\n'
          done <<< "$base_fragments"
          if [ -n "$amended" ]; then
            printf 'Declared changelog amendments:\n%s' "$amended"
          fi
          if [ -n "$removed" ]; then
            printf 'Declared changelog removals:\n%s' "$removed"
          fi
          if [ -n "$disturbed" ]; then
            echo "::error::This PR changes a changelog fragment that already exists on the base branch, which discards another change's unreleased release note."
            printf '%s' "$disturbed"
            echo "Leave other branches' fragments untouched. If the name collides with yours, rename this branch so it derives a free filename, then rename your fragment and its branch: frontmatter to match."
            echo "To correct an unreleased note on purpose, apply the changelog-amend label AND add one line per fragment to the PR body:"
            echo "  Changelog-Amend: <fragment-file-name>.md"
            echo "To delete the note of an unreleased feature this PR withdraws, use the same label with:"
            echo "  Changelog-Remove: <fragment-file-name>.md"
            exit 1
          fi

          # A declared amendment or removal is itself the changelog record for a change to unreleased behavior.
          # Keep it exclusive of a new branch fragment and of the legacy no-changelog label.
          if [ -n "$amended$removed" ]; then
            if [ -n "$fragment_files" ]; then
              echo "::error::This PR both amends or removes an existing unreleased fragment and adds a branch fragment. Keep only the declared change."
              exit 1
            fi
            if [ "$has_no_changelog" = "true" ]; then
              echo "::error::This PR carries both a declared changelog amendment or removal and the no-changelog label. Remove no-changelog."
              exit 1
            fi
            echo "Existing unreleased changelog fragment amended or removed; no branch fragment required."
            exit 0
          fi

          if [ -n "$fragment_files" ]; then
            if [ "$has_no_changelog" = "true" ]; then
              echo "::error::This PR carries both a changelog fragment and the no-changelog label. Remove one."
              exit 1
            fi
            expected=$(node scripts/compile-changelog-fragments.mjs --name-for-branch "$HEAD_BRANCH")
            while IFS= read -r fragment; do
              [ -n "$fragment" ] || continue
              if [ "${fragment#.changelog.d/}" != "$expected" ]; then
                echo "::error file=$fragment::Fragment name does not match this PR's branch. Branch '$HEAD_BRANCH' derives .changelog.d/$expected. Rename the file and its branch: frontmatter."
                exit 1
              fi
              # The compiler can only check that the declared branch and the filename agree after normalization,
              # so slug-equivalent values ('feat/foo/bar' for branch 'feat/foo-bar') pass it. Only CI knows the
              # real head ref, so the exact-branch half of the contract is enforced here.
              # The compiler accepts CRLF frontmatter, so this must too, or a fragment it validates would be
              # rejected here.
              declared=$(awk 'BEGIN { inside = 0 } { sub(/\r$/, "") } NR == 1 { if ($0 != "---") exit; inside = 1; next } inside && $0 == "---" { exit } inside && /^branch:[[:space:]]*/ { sub(/^branch:[[:space:]]*/, ""); print; exit }' "$fragment")
              if [ "$declared" != "$HEAD_BRANCH" ]; then
                echo "::error file=$fragment::Fragment declares branch '$declared' but this PR's head branch is '$HEAD_BRANCH'. Correct the branch: frontmatter."
                exit 1
              fi
            done <<< "$fragment_files"
            printf 'Changed changelog fragments:\n%s\n' "$fragment_files"
            exit 0
          fi

          # No fragment is allowed. Inclusion is an autonomous product judgment (feature-level user delta),
          # not a CI checklist. The legacy no-changelog label remains optional and is not required here.
          echo "No changelog fragment added; omission is allowed without a no-changelog declaration."
          exit 0

      - name: Validate changelog fragments
        run: node scripts/compile-changelog-fragments.mjs --check --allow-empty
