name: Changelog Fragment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog fragment presence
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          merge_base=$(git merge-base "$BASE_REF" "$HEAD_REF")
          # Deletions count: removing a feature is exactly the case that needs a Removed entry. Renames count on
          # BOTH sides, because a rename can carry an edit with it and can move a file across the internal/runtime
          # line in either direction.
          changed_files=$(git diff --name-status --diff-filter=AMDR "$merge_base" "$HEAD_REF" \
            | awk 'BEGIN { FS = "\t" } { if ($1 ~ /^R/) { print $2; print $3 } else { print $2 } }')
          # AGENTS.md/CLAUDE.md live in .changelog.d/ but are doctrine, not fragments.
          fragment_filter() { grep -E '^\.changelog\.d/[^/]+\.md$' | grep -vE '^\.changelog\.d/(AGENTS|CLAUDE)\.md$' || true; }
          fragment_files=$(git diff --name-only --diff-filter=A "$merge_base" "$HEAD_REF" | fragment_filter)
          if node -e "const labels = JSON.parse(process.env.LABELS_JSON); process.exit(labels.some((label) => label.name === 'no-changelog') ? 0 : 1);"; then
            has_no_changelog=true
          else
            has_no_changelog=false
          fi

          # Every fragment already on the base branch belongs to another change that has not been released yet.
          # This PR must leave all of them byte-identical: an edit overwrites another branch's release note (two
          # branch names can slug to one filename), and a delete or rename removes it outright. Compare each base
          # fragment across the range rather than filtering by change type, so M, D and R are all caught.
          base_fragments=$(git ls-tree -r --name-only "$merge_base" -- .changelog.d | fragment_filter)
          disturbed=""
          while IFS= read -r fragment; do
            [ -n "$fragment" ] || continue
            if ! git diff --quiet "$merge_base" "$HEAD_REF" -- "$fragment"; then
              disturbed="${disturbed}${fragment}"$'\n'
            fi
          done <<< "$base_fragments"
          if [ -n "$disturbed" ]; then
            echo "::error::This PR changes a changelog fragment that already exists on the base branch, which discards another change's unreleased release note."
            printf '%s' "$disturbed"
            echo "Leave other branches' fragments untouched. If the name collides with yours, rename this branch so it derives a free filename, then rename your fragment and its branch: frontmatter to match."
            exit 1
          fi

          if [ -n "$fragment_files" ]; then
            if [ "$has_no_changelog" = "true" ]; then
              echo "::error::This PR carries both a changelog fragment and the no-changelog label. Remove one."
              exit 1
            fi
            expected=$(node scripts/compile-changelog-fragments.mjs --name-for-branch "$HEAD_BRANCH")
            while IFS= read -r fragment; do
              [ -n "$fragment" ] || continue
              if [ "${fragment#.changelog.d/}" != "$expected" ]; then
                echo "::error file=$fragment::Fragment name does not match this PR's branch. Branch '$HEAD_BRANCH' derives .changelog.d/$expected. Rename the file and its branch: frontmatter."
                exit 1
              fi
              # The compiler can only check that the declared branch and the filename agree after normalization,
              # so slug-equivalent values ('feat/foo/bar' for branch 'feat/foo-bar') pass it. Only CI knows the
              # real head ref, so the exact-branch half of the contract is enforced here.
              declared=$(awk 'BEGIN { inside = 0 } NR == 1 { if ($0 != "---") exit; inside = 1; next } inside && $0 == "---" { exit } inside && /^branch:[[:space:]]*/ { sub(/^branch:[[:space:]]*/, ""); print; exit }' "$fragment")
              if [ "$declared" != "$HEAD_BRANCH" ]; then
                echo "::error file=$fragment::Fragment declares branch '$declared' but this PR's head branch is '$HEAD_BRANCH'. Correct the branch: frontmatter."
                exit 1
              fi
            done <<< "$fragment_files"
            printf 'Changed changelog fragments:\n%s\n' "$fragment_files"
            exit 0
          fi

          # No fragment. Every changed path must be mechanically internal, or the PR must declare why.
          runtime_paths=$(printf '%s\n' "$changed_files" | grep -vE '(^|/)tests?/|\.test\.|\.spec\.|^\.agents/|^\.github/|(^|/)(AGENTS|CLAUDE)\.md$|^\.changelog\.d/|^scripts/compile-changelog-fragments' || true)
          if [ -z "$runtime_paths" ]; then
            echo "Every changed path is mechanically internal; no changelog fragment required."
            exit 0
          fi

          impact=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -E '^Changelog-Impact:[[:space:]]*none[[:space:]]*$' || true)
          reason=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -E '^No-Changelog-Reason:[[:space:]]*(internal-refactor|boundary-gate|doctrine-prompt|test-repair|release-tooling)[[:space:]]*$' || true)
          if [ "$has_no_changelog" != "true" ] || [ -z "$impact" ] || [ -z "$reason" ]; then
            echo "::error::This PR changes source a user can reach but adds no changelog fragment."
            printf 'Paths that require a release note:\n%s\n' "$runtime_paths"
            echo "Add the branch-named fragment (node scripts/compile-changelog-fragments.mjs --name-for-branch), or apply the no-changelog label AND put these two lines in the PR body:"
            echo "  Changelog-Impact: none"
            echo "  No-Changelog-Reason: internal-refactor | boundary-gate | doctrine-prompt | test-repair | release-tooling"
            exit 1
          fi
          printf 'Declared no-changelog for source paths:\n%s\n%s\n' "$reason" "$runtime_paths"

      - name: Validate changelog fragments
        run: node scripts/compile-changelog-fragments.mjs --check --allow-empty
