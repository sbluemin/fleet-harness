name: Stable Release

on:
  push:
    branches:
      - main
    # 비배포 경로만 변경된 푸시는 릴리스를 트리거하지 않는다.
    # (문서/플랜/CI·에이전트 설정/마크다운 — npm 산출물에 영향 없음)
    # GitHub Pages 발행과 npm 발행을 분리하기 위한 필터.
    # '**.md'는 루트를 포함한 모든 깊이의 마크다운을 매칭한다('**/*.md'는 루트 누락).
    paths-ignore:
      - 'docs/**'
      - '.fleet/**'
      - '.github/**'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      - '**.md'

concurrency:
  group: stable-release-main
  cancel-in-progress: false

# desktop 재사용 워크플로가 GitHub Release에 아티팩트를 게시하려면 워크플로 레벨에서 write가 필요하다
# (uses: 잡의 권한은 호출 워크플로의 권한을 넘을 수 없으므로 read로 두면 desktop publish가 막힌다).
permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      next_version: ${{ steps.version.outputs.next_version }}
      next_tag: ${{ steps.version.outputs.next_tag }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      desktop_changed: ${{ steps.desktop.outputs.desktop_changed }}
      desktop_version: ${{ steps.desktop.outputs.desktop_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

      - name: Stop on release commit
        id: guard
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$HEAD_MESSAGE" | head -1 | grep -Fq 'chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve next version
        if: steps.guard.outputs.skip == 'false'
        id: version
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -n "$latest_tag" ]; then
            range="$latest_tag..HEAD"
            log_output=$(git log --format=%B "$range")
            commit_count=$(git rev-list --count "$range")
            version_source="${latest_tag#v}"
          else
            range="HEAD"
            log_output=$(git log --format=%B)
            commit_count=$(git rev-list --count HEAD)
            version_source=$(node -p "require('./package.json').version")
          fi

          if [ "$commit_count" -eq 0 ]; then
            echo "No commits since latest tag. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="patch"
          if printf '%s\n' "$log_output" | grep -Eq '^[[:space:]]*feat(\([^)]+\))?!?:'; then
            bump="minor"
          fi

          next_version=$(node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            const bump = process.argv[2];
            const next = { minor: [major, minor + 1, 0], patch: [major, minor, patch + 1] }[bump];
            console.log(next.join('.'));
          " "$version_source" "$bump")

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "current_version=$version_source" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "next_tag=v$next_version" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Check existing release commit
        if: steps.version.outputs.should_release == 'true'
        id: release_state
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" = "$NEXT_VERSION" ] && grep -Eq "^## \\[$NEXT_VERSION\\]" CHANGELOG.md; then
            echo "release_committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_committed=false" >> "$GITHUB_OUTPUT"
          fi

      # desktop 셸은 독립 버저닝: 마지막 성공 빌드 마커(desktop-v* 태그) 이후 desktop 경로에 변경이
      # 있을 때만 빌드하고, 없으면 직전 릴리스의 셸 설치본을 이월한다. 감지 기준점을 직전 main 태그가
      # 아닌 마지막 desktop-v* 태그로 잡아 "빌드 실패 후 무변경 릴리스"가 미빌드 변경을 놓치지 않게 한다.
      - name: Resolve desktop shell version
        if: steps.version.outputs.should_release == 'true'
        id: desktop
        run: |
          pkg_version=$(node -p "require('./runtime/fleet-desktop/package.json').version")
          last_tag=$(git tag --list 'desktop-v*' --sort=-version:refname | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          emit() {
            echo "desktop_changed=$1" >> "$GITHUB_OUTPUT"
            echo "desktop_version=$2" >> "$GITHUB_OUTPUT"
            echo "desktop_bump=$3" >> "$GITHUB_OUTPUT"
          }

          if [ -z "$last_tag" ]; then
            # 부트스트랩: 성공 빌드 마커가 없으면 시드 버전 그대로 무조건 빌드한다(범프 없음).
            emit true "$pkg_version" false
            exit 0
          fi

          if [ "$pkg_version" != "${last_tag#desktop-v}" ]; then
            # 이미 범프됨(릴리스 커밋 재실행 경로 또는 PR에서의 수동 범프) — 그 버전 그대로 빌드한다.
            emit true "$pkg_version" false
            exit 0
          fi

          if git diff --quiet "$last_tag"..HEAD -- runtime/fleet-desktop; then
            emit false "$pkg_version" false
            exit 0
          fi

          # main 버전 산정과 같은 규칙을 desktop 경로 커밋에만 적용한다: feat이면 minor, 아니면 patch.
          bump="patch"
          if git log --format=%B "$last_tag"..HEAD -- runtime/fleet-desktop | grep -Eq '^[[:space:]]*feat(\([^)]+\))?!?:'; then
            bump="minor"
          fi
          next=$(node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            const next = process.argv[2] === 'minor' ? [major, minor + 1, 0] : [major, minor, patch + 1];
            console.log(next.join('.'));
          " "$pkg_version" "$bump")
          emit true "$next" true

      - name: Update version and changelog
        if: steps.version.outputs.should_release == 'true' && steps.release_state.outputs.release_committed != 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          # 루트 + 모든 워크스페이스 package.json의 version 필드를 동시에 갱신.
          # 들여쓰기/포맷 보존을 위해 JSON.stringify 대신 정규식 치환을 사용한다.
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const nextVersion = process.env.NEXT_VERSION;
          const tracked = execSync('git ls-files', { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean);
          // desktop 셸은 독립 버저닝(desktop-v* 태그 트레인)을 쓰므로 릴리스 sync 대상에서 제외한다.
          const files = tracked
            .filter((f) => f === 'package.json' || f.endsWith('/package.json'))
            .filter((f) => f !== 'runtime/fleet-desktop/package.json');
          for (const file of files) {
            const raw = fs.readFileSync(file, 'utf8');
            // 루트 레벨의 첫 "version" 필드만 치환한다 (각 package.json에서 1회만 등장).
            const updated = raw.replace(/("version":\s*")[^"]+(")/, `$1${nextVersion}$2`);
            if (updated !== raw) {
              fs.writeFileSync(file, updated);
            }
          }
          NODE

          RELEASE_DATE=$(date -u +%F)
          export RELEASE_DATE

          node scripts/compile-changelog-fragments.mjs --version "$NEXT_VERSION" --date "$RELEASE_DATE" --allow-empty

      - name: Bump desktop shell version
        if: steps.version.outputs.should_release == 'true' && steps.release_state.outputs.release_committed != 'true' && steps.desktop.outputs.desktop_bump == 'true'
        env:
          DESKTOP_VERSION: ${{ steps.desktop.outputs.desktop_version }}
        run: |
          # desktop 변경이 감지된 릴리스에서만 셸 버전을 범프해 릴리스 커밋에 함께 담는다.
          node <<'NODE'
          const fs = require('fs');
          const file = 'runtime/fleet-desktop/package.json';
          const raw = fs.readFileSync(file, 'utf8');
          const updated = raw.replace(/("version":\s*")[^"]+(")/, `$1${process.env.DESKTOP_VERSION}$2`);
          if (updated === raw) {
            throw new Error(`Failed to update the version field in ${file}`);
          }
          fs.writeFileSync(file, updated);
          NODE

      - name: Verify workspace version sync
        if: steps.version.outputs.should_release == 'true' && steps.release_state.outputs.release_committed != 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          # 모든 tracked package.json이 NEXT_VERSION으로 통일되었는지 JSON parse로 사후 검증.
          # 정규식 치환이 누락한 비표준 포맷이나 새 패키지의 silent drift를 잡아낸다.
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const expected = process.env.NEXT_VERSION;
          const tracked = execSync('git ls-files', { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean);
          const files = tracked.filter((f) => f === 'package.json' || f.endsWith('/package.json'));
          const offenders = [];
          let checked = 0;
          for (const file of files) {
            if (file === 'runtime/fleet-desktop/package.json') {
              // desktop 셸은 독립 버저닝이라 sync 검증 대상이 아니다.
              console.log(`skipped ${file}: independent desktop shell versioning`);
              continue;
            }
            let pkg;
            try {
              pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (err) {
              offenders.push(`${file} → parse error: ${err.message}`);
              continue;
            }
            if (typeof pkg.version !== 'string') {
              // version 필드가 없는 워크스페이스 root manifest 등은 sync 대상이 아니다.
              console.log(`skipped ${file}: no version field`);
              continue;
            }
            checked++;
            if (pkg.version !== expected) {
              offenders.push(`${file} → version=${pkg.version} (expected ${expected})`);
            }
          }
          if (offenders.length > 0) {
            console.error('Workspace version sync failed:');
            for (const line of offenders) console.error(`  ${line}`);
            process.exit(1);
          }
          console.log(`OK: ${checked} package.json file(s) synced to ${expected}`);
          NODE

      # npm 배포(fleet-console/fleet-cli)와 desktop 빌드는 아래 별도 재사용 워크플로로 분리됐다.
      # 이 잡은 릴리스 핵심 책임(버전 산정·changelog·커밋·태그·GitHub Release)만 담당한다.

      - name: Commit release changes
        if: steps.version.outputs.should_release == 'true' && steps.release_state.outputs.release_committed != 'true'
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CHANGELOG.md CHANGELOG.ko.md .changelog.d
          git ls-files | grep -E '(^|/)package\.json$' | xargs git add
          git commit -m "chore(release): $NEXT_TAG"
          git push origin HEAD:main

      - name: Sync release commit from main
        if: steps.version.outputs.should_release == 'true'
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

      - name: Resolve release commit
        if: steps.version.outputs.should_release == 'true'
        id: release
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.version.outputs.should_release == 'true'
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          if git rev-parse "refs/tags/$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists. Treating as success."
          else
            git tag "$NEXT_TAG" "$RELEASE_SHA"
            git push origin "$NEXT_TAG"
          fi

      - name: Write release notes file
        if: steps.version.outputs.should_release == 'true'
        id: notes
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          DESKTOP_CHANGED: ${{ steps.desktop.outputs.desktop_changed }}
          DESKTOP_VERSION: ${{ steps.desktop.outputs.desktop_version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const version = process.env.NEXT_VERSION;
          const marker = `## [${version}]`;
          const start = changelog.indexOf(marker);

          if (start === -1) {
            throw new Error(`Unable to find changelog section for ${version}`);
          }

          const bodyStart = changelog.indexOf('\n', start);
          const nextHeader = changelog.indexOf('\n## [', bodyStart + 1);
          const body = changelog.slice(bodyStart + 1, nextHeader === -1 ? changelog.length : nextHeader).trim();
          // desktop 셸은 독립 버저닝이라 이번 릴리스에서 빌드됐는지/이월됐는지를 노트에 명시한다.
          const desktopLine = process.env.DESKTOP_CHANGED === 'true'
            ? `**Desktop shell ${process.env.DESKTOP_VERSION}** — built in this release.`
            : `**Desktop shell ${process.env.DESKTOP_VERSION}** — unchanged, carried over from ${process.env.LATEST_TAG}.`;
          const notesPath = 'release-notes.md';
          const notes = `${body}\n\n${desktopLine}\n\n---\n\n_Additional GitHub-generated release notes are appended below._\n`;

          fs.writeFileSync(notesPath, notes);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes_path=${notesPath}\n`);
          NODE

      - name: Create draft GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Release $NEXT_TAG already exists. Treating as success."
            exit 0
          fi

          # atomic 릴리스: 초안(draft)으로 만든다. npm/desktop 산출물이 모두 붙은 뒤
          # 아래 publish-release 잡이 공개로 전환한다. desktop 잡이 이 초안에 아티팩트를 업로드한다.
          gh release create "$NEXT_TAG" \
            --draft \
            --title "$NEXT_TAG" \
            --target "$RELEASE_SHA" \
            --notes-file "$NOTES_PATH" \
            --generate-notes

  # 릴리스 커밋이 만들어진 뒤, 각 산출물을 재사용 워크플로로 배포한다(모두 릴리스 ref를 checkout).
  # 별도 이벤트 트리거가 아니라 호출로 같은 런에 이어붙인다(GITHUB_TOKEN 이벤트는 워크플로를 트리거하지 못함).
  #
  # 원자성 전략(atomic release):
  #   npm publish는 되돌릴 수 없으므로(unpublish는 사실상 불가) 되돌릴 수 없는 연산을 파이프라인
  #   마지막으로 몬다: desktop 산출물이 초안 Release에 모두 붙은 뒤에야 npm에 'latest'로 직접 올린다.
  #   desktop이 실패하면 npm publish가 아예 실행되지 않아 기본 설치 경로(`npm i`)는 이전 버전에 머문다.
  #
  #   과거에는 'next'로 스테이징한 뒤 dist-tag로 'latest' 승격하는 2단계였으나, npm이 2FA 우회
  #   granular access token의 dist-tag write를 차단하면서(2026-08 시행) 승격 단계가 403으로 막혔다.
  #   publish는 버전당 한 번뿐이라 이미 올라간 버전의 태그를 나중에 옮길 방법이 없으므로 처음부터
  #   latest로 올린다. 롤백은 dist-tag 이동이 아니라 `npm deprecate` + 다음 패치 릴리스로 처리한다.

  # fleet-console → npm (latest 직접 게시). desktop 산출물이 준비된 뒤에만 실행된다.
  # desktop 두 잡은 상호배타라 정확히 하나만 성공하면 된다(needs에 skipped 잡이 섞이므로
  # !cancelled() + 명시적 result 체크가 필수).
  console:
    needs: [release, desktop-build, desktop-carry]
    if: >-
      !cancelled() &&
      needs.release.outputs.should_release == 'true' &&
      (needs.desktop-build.result == 'success' || needs.desktop-carry.result == 'success')
    uses: ./.github/workflows/console-release.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      version: ${{ needs.release.outputs.next_version }}
      dist_tag: latest
    secrets: inherit

  # fleet-cli → npm (같은 버전의 fleet-console에 의존하므로 console 배포 후 실행)
  cli:
    needs: [release, console, desktop-build, desktop-carry]
    if: >-
      !cancelled() &&
      needs.release.outputs.should_release == 'true' &&
      needs.console.result == 'success' &&
      (needs.desktop-build.result == 'success' || needs.desktop-carry.result == 'success')
    uses: ./.github/workflows/cli-release.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      version: ${{ needs.release.outputs.next_version }}
      dist_tag: latest
    secrets: inherit

  # desktop 셸 → 마지막 성공 빌드(desktop-v* 태그) 이후 변경이 있을 때만 네이티브 러너 매트릭스로
  # 빌드해 초안 Release에 첨부한다. 셸은 main v* 트레인과 별개의 독립 버저닝을 쓴다.
  desktop-build:
    needs: release
    if: needs.release.outputs.should_release == 'true' && needs.release.outputs.desktop_changed == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
      tag: ${{ needs.release.outputs.next_tag }}
    secrets: inherit

  # desktop 무변경 릴리스 → 직전 릴리스의 셸 설치본을 그대로 초안 Release에 이월한다.
  # 바이트 동일 복사라 서명/노터라이즈가 유지되고, 직전 릴리스에서 받으므로 무변경이 연속돼도
  # 자산 체인이 자동으로 이어진다. 매 릴리스에 설치본이 항상 부착되게 하기 위한 장치.
  desktop-carry:
    needs: release
    if: needs.release.outputs.should_release == 'true' && needs.release.outputs.desktop_changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Carry forward desktop assets from the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ needs.release.outputs.latest_tag }}
          NEXT_TAG: ${{ needs.release.outputs.next_tag }}
        run: |
          mkdir -p desktop-assets
          gh release download "$PREV_TAG" -R "${{ github.repository }}" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' \
            --dir desktop-assets
          count=$(find desktop-assets -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No desktop shell assets found on $PREV_TAG to carry forward" >&2
            exit 1
          fi
          gh release upload "$NEXT_TAG" desktop-assets/* --clobber -R "${{ github.repository }}"

  # 셸 빌드가 성공했을 때만 성공-빌드 마커 태그(desktop-v*)를 릴리스 커밋에 남긴다.
  # 이 태그가 다음 릴리스의 변경 감지 기준점이므로, 빌드 실패 시 태그가 남지 않아
  # 다음 릴리스가 미빌드 변경을 다시 잡아 재빌드한다. 태그에 별도 Release는 만들지 않는다.
  desktop-tag:
    needs: [release, desktop-build]
    if: needs.release.outputs.should_release == 'true' && needs.desktop-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the built desktop shell version
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_TAG: desktop-v${{ needs.release.outputs.desktop_version }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$DESKTOP_TAG" >/dev/null 2>&1; then
            echo "Tag $DESKTOP_TAG already exists. Treating as success."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$DESKTOP_TAG" -f sha="$RELEASE_SHA"

  # 릴리스의 마무리 단계. npm 게시(latest)까지 끝난 뒤 초안 Release를 공개한다.
  # console/cli가 실패하면 이 잡은 실행되지 않아 Release는 draft로 남는다(desktop 실패는 console
  # 단계에서 이미 걸러진다). 진짜 커밋 지점은 npm publish 쪽으로 옮겨갔고, 여기 남은 draft 공개는
  # 가역(다시 draft로 되돌릴 수 있음)이자 멱등이라 부분 실패 시 이 잡만 재실행하면 수렴한다.
  # npm 산출물에 문제가 있으면 `npm deprecate <나쁜버전>` + 다음 패치 릴리스로 대응한다(unpublish는 쓰지 않는다).
  publish-release:
    needs: [release, console, cli]
    if: >-
      !cancelled() &&
      needs.release.outputs.should_release == 'true' &&
      needs.console.result == 'success' &&
      needs.cli.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release.outputs.next_tag }}" -R ${{ github.repository }} --draft=false
