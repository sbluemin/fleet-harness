appId: com.dotobokuri.fleet-console
productName: Fleet Console
artifactName: "Fleet Console-${version}-${os}-${arch}.${ext}"
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - package.json
asar: true
publish: null
afterPack: ./scripts/verify-packaged-app.mjs
# mac dmg/zip이 만드는 .blockmap·latest*.yml(updater 산출물)을 빌드 직후 제거한다 — shell-only는 electron-updater를
# 쓰지 않고 verify:package가 이들을 금지하므로. (nsis는 differentialPackage:false로 별도 억제)
afterAllArtifactBuild: ./scripts/strip-updater-artifacts.mjs
# 액세스 링크는 `fleet://join?code=…` 하나뿐이라, OS가 이 스킴을 Fleet Console로 보내 주어야
# 붙여넣기 없이 링크를 열 수 있다. 설치본에서만 성립하므로 개발 실행은 붙여넣기 경로를 쓴다.
protocols:
  - name: Fleet Console access link
    schemes:
      - fleet
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
    - target: zip
win:
  icon: build/icon.ico
  signExts:
    - .exe
    - .dll
    - .node
  # Windows는 x64만 지원한다(arm64 nsis는 electron-builder 결함으로 malformed 설치본을 만든다).
  # arm64 Windows 사용자는 x64 빌드를 에뮬레이션으로 실행한다. arm64 호스트에서 빌드해도 x64가 나오도록 고정.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
