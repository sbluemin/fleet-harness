appId: com.dotobokuri.fleet-console
productName: Fleet Console
# 공백 없는 이름이어야 한다. GitHub는 업로드된 자산 이름의 공백을 마침표로 바꾸고(`Fleet.Console-…`),
# electron-updater는 메타데이터의 이름에서 공백을 하이픈으로 바꿔 내려받는다(`Fleet-Console-…`).
# 공백이 하나라도 있으면 두 규칙이 갈라져 갱신 다운로드가 404가 된다.
artifactName: "Fleet-Console-${version}-${os}-${arch}.${ext}"
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - package.json
asar: true
# 셸은 electron-updater로 자기 자신을 갱신하므로 갱신 메타데이터(latest*.yml)가 산출물에 있어야 한다.
# 이 선언이 있어야 electron-builder가 그 파일과 패키지 안의 app-update.yml을 함께 만든다.
# 업로드는 릴리스 워크플로가 하므로 빌드는 항상 `--publish never`로 돈다.
publish:
  provider: github
  owner: sbluemin
  repo: fleet-harness
afterPack: ./scripts/verify-packaged-app.mjs
# 액세스 링크는 `fleet://join?code=…` 하나뿐이라, OS가 이 스킴을 Fleet Console로 보내 주어야
# 붙여넣기 없이 링크를 열 수 있다. 설치본에서만 성립하므로 개발 실행은 붙여넣기 경로를 쓴다.
protocols:
  - name: Fleet Console access link
    schemes:
      - fleet
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  extendInfo:
    NSAppleEventsUsageDescription: "When you enable Computer Use, Fleet Console communicates with the installed ChatGPT/Codex Computer Use service to read and control apps on your Mac."
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
    - target: zip
win:
  icon: build/icon.ico
  signExts:
    - .exe
    - .dll
    - .node
  # Windows는 x64만 지원한다(arm64 nsis는 electron-builder 결함으로 malformed 설치본을 만든다).
  # arm64 Windows 사용자는 x64 빌드를 에뮬레이션으로 실행한다. arm64 호스트에서 빌드해도 x64가 나오도록 고정.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
