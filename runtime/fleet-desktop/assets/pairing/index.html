<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action fleet-desktop-pairing:">
  <title>Connect to Runtime</title>
  <link rel="stylesheet" href="pairing.css">
</head>
<body>
  <main>
    <h1>Connect to Runtime</h1>
    <p>Choose a local Fleet Console or a remote runtime over SSH.</p>
    <input class="mode" id="mode-loopback" name="pairing-mode" type="radio" checked>
    <input class="mode" id="mode-ssh" name="pairing-mode" type="radio">
    <div class="tabs" role="tablist" aria-label="Runtime connection type">
      <label for="mode-loopback" role="tab">Loopback address</label>
      <label for="mode-ssh" role="tab">Remote over SSH</label>
    </div>
    <section class="panel panel-loopback" aria-label="Loopback address">
      <form action="fleet-desktop-pairing://submit/" method="get">
        <input name="mode" type="hidden" value="loopback">
        <label for="target">Fleet Console runtime address</label>
        <input id="target" name="target" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="127.0.0.1:4310" pattern="127\.0\.0\.1:[1-9][0-9]{0,4}" maxlength="15" required autofocus>
        <div class="actions">
          <button type="submit">Connect</button>
          <a href="fleet-desktop-pairing://cancel/">Cancel</a>
        </div>
      </form>
    </section>
    <section class="panel panel-ssh" aria-label="Remote over SSH">
      <form action="fleet-desktop-pairing://submit/" method="get">
        <input name="mode" type="hidden" value="ssh">
        <label for="ssh-host">SSH host</label>
        <input id="ssh-host" name="host" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="user@devbox" maxlength="255" required>
        <div class="actions">
          <button type="submit">Connect</button>
          <a href="fleet-desktop-pairing://cancel/">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
