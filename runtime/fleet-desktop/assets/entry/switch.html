<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 붙잡아 둔 옛 화면은 main이 data: 이미지로 들여보낸다. 그 밖에는 어떤 출처도 열지 않는다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src data:; font-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Fleet Console Desktop</title>
  <link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="switch.css">
</head>
<body>
  <img class="frame" id="frame" alt="" draggable="false">
  <header class="drag-strip" aria-hidden="true"></header>
  <div class="pill" id="pill" role="status" aria-live="polite">
    <span class="pill-mark" aria-hidden="true"></span>
    <span class="pill-text" id="pill-text"></span>
  </div>
</body>
</html>
