<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Fleet Console Desktop</title>
  <link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="entry.css">
</head>
<body>
  <header class="drag-strip" aria-hidden="true"></header>
  <main class="entry-core">
    <!-- Commodore Pennant F 조형 — 타일 없이 캔버스 중앙에 세우고 블레이드에만 스페큘러 광택을 흘린다. -->
    <svg class="brand-mark" viewBox="11.25 8 44 48" aria-hidden="true">
      <defs>
        <linearGradient id="brand-mast-g" x1="0" y1="0" x2="0.25" y2="1">
          <stop offset="0%" stop-color="var(--mark-mast-top)" />
          <stop offset="100%" stop-color="var(--mark-mast-body)" />
        </linearGradient>
        <linearGradient id="brand-blade-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--mark-blade-top)" />
          <stop offset="55%" stop-color="var(--mark-blade-body)" />
          <stop offset="100%" stop-color="var(--mark-blade-edge)" />
        </linearGradient>
        <clipPath id="brand-blade-clip">
          <path d="M29 29.5H44.5L40.5 38H29Z" />
        </clipPath>
        <linearGradient id="brand-sheen-g" x1="0" y1="0" x2="1" y2="0.35">
          <stop offset="0%" stop-color="transparent" />
          <stop offset="48%" stop-color="var(--mark-sheen)" />
          <stop offset="100%" stop-color="transparent" />
        </linearGradient>
      </defs>
      <g class="brand-mark-mast">
        <path class="brand-mark-pennant" d="M18.25 14.5H48.25L43.25 20L48.25 25.5H26V45.75L18.25 50Z" fill="url(#brand-mast-g)" />
        <path class="brand-mark-fold" d="M18.25 14.5H48.25L43.25 20H24.2Z" />
      </g>
      <g class="brand-mark-blade">
        <path class="brand-mark-blade-main" d="M29 29.5H44.5L40.5 38H29Z" fill="url(#brand-blade-g)" />
        <path class="brand-mark-blade-rim" d="M29 29.5H44.5L43.7 31.2H29Z" />
        <g clip-path="url(#brand-blade-clip)">
          <polygon class="brand-mark-sheen" points="22,27 32,27 25,41 15,41" fill="url(#brand-sheen-g)" />
        </g>
      </g>
    </svg>
    <section class="entry-stage" aria-live="polite">
      <div class="status">
        <span class="status-signal" aria-hidden="true"></span>
        <span class="status-title" id="status-title"></span>
        <span class="status-pct" id="status-pct"></span>
      </div>
      <div class="bar" id="bar" aria-hidden="true"><span class="bar-fill" id="bar-fill"></span></div>
      <p class="detail" id="detail"></p>
    </section>
  </main>
  <footer class="entry-footer">
    <span class="versions" id="versions"></span>
    <span class="dev-tag" id="dev-tag">DEV</span>
  </footer>
</body>
</html>
