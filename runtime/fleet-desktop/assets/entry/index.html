<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'none'; connect-src 'none'; img-src 'none'; font-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Fleet Console Desktop</title>
  <link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="entry.css">
</head>
<body>
  <header class="drag-strip" aria-hidden="true"></header>
  <!-- Console 파비콘과 같은 조형(Commodore Pennant F)이다 — 넘겨줄 때 대화 중심 화면 맨 위 줄(52px)의 세로 중심(entry.css --brand-glyph-left)으로 줄어든다. -->
  <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
    <rect class="brand-mark-tile" x="2" y="2" width="60" height="60" rx="14" />
    <path class="brand-mark-pennant" d="M19.25 15.25H47.5L42.75 20.25L47.5 25.25H26.5V45L19.25 49Z" />
    <path class="brand-mark-blade" d="M29.25 29.5H43.5L39.75 37.25H29.25Z" />
  </svg>
  <!-- 개발 빌드는 Console 워드마크와 같은 「Fleet·DEV」다(is-dev일 때만 점과 DEV가 선다). -->
  <h1 class="wordmark">Fleet<span class="wordmark-sep" aria-hidden="true">·</span><span class="wordmark-tag">DEV</span></h1>
  <main class="entry-stage">
    <p class="tagline" id="tagline"></p>
    <section class="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-title" id="status-title"></span>
    </section>
    <div class="bar" id="bar" aria-hidden="true"><span class="bar-fill" id="bar-fill"></span></div>
    <p class="detail" id="detail"></p>
  </main>
  <footer class="versions" id="versions"></footer>
  <span class="dev-tag" id="dev-tag">LOCAL BUILD</span>
</body>
</html>
