<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fleet Console">
  <!-- Fleet Console favicon · Commodore Pennant F (Light): 웜 알라바스터 타일 위 사령관 기함기 모노그램 -->
  <defs>
    <linearGradient id="fav-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfd" />
      <stop offset="52%" stop-color="#f6f5f2" />
      <stop offset="100%" stop-color="#eae8e2" />
    </linearGradient>
    <linearGradient id="fav-mast" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1c1f26" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>
    <linearGradient id="fav-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8904a" />
      <stop offset="100%" stop-color="#876326" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fav-tile)" stroke="#d4d0c7" stroke-width="1.5" />
  <!-- 사령관 제비꼬리 광폭 페넌트 + 마스트 -->
  <path d="M18.25 14.5H48.25L43.25 20L48.25 25.5H26V45.75L18.25 50Z" fill="url(#fav-mast)" />
  <!-- 호위 지휘 블레이드 (burnished brass) -->
  <path d="M29 29.5H44.5L40.5 38H29Z" fill="url(#fav-brass)" />
</svg>
