<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fleet Console">
  <!-- Maritime Console favicon · Bearing Scope: 화이트 타일 위 관측·지휘 계기와 살아있는 신호 -->
  <defs>
    <!-- 화이트 계열 타일 배경 -->
    <radialGradient id="fav-sea" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="58%" stop-color="#f6f8fb" />
      <stop offset="100%" stop-color="#ebf0f6" />
    </radialGradient>
    <!-- 황동 계기 그라데이션 (밝은 배경 대비 강화) -->
    <linearGradient id="fav-brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#da8a0c" />
      <stop offset="100%" stop-color="#985200" />
    </linearGradient>
    <linearGradient id="fav-brass-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e09e30" />
      <stop offset="100%" stop-color="#b67618" />
    </linearGradient>
  </defs>
  <!-- 둥근 사각 타일: 화이트 그라데이션 + 쿨 슬레이트 테두리 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fav-sea)" stroke="#ced7e2" stroke-width="1.25" />
  <!-- 계기 베젤 동심원 (brass = 지금 보고 있는 곳) -->
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="18.5" stroke="url(#fav-brass)" stroke-width="3" />
    <circle cx="32" cy="32" r="10.5" stroke="url(#fav-brass-inner)" stroke-width="1.6" opacity="0.72" />
  </g>
  <!-- 방위 십자선 -->
  <g stroke="#c47a0e" stroke-width="2.4" stroke-linecap="round">
    <line x1="32" y1="9" x2="32" y2="17" />
    <line x1="32" y1="47" x2="32" y2="55" />
    <line x1="9" y1="32" x2="17" y2="32" />
    <line x1="47" y1="32" x2="55" y2="32" />
  </g>
  <!-- 계기 중심점 -->
  <circle cx="32" cy="32" r="2.6" fill="#da8a0c" />
  <!-- aurora 라이브 블립 (밝은 배경 대비 강화) -->
  <circle cx="44.7" cy="19.3" r="4.6" fill="#0d9ea0" />
  <circle cx="44.7" cy="19.3" r="7.6" fill="none" stroke="#0d9ea0" stroke-width="1.4" opacity="0.4" />
</svg>
