<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: dark;

  /* 배경 계층 */
  --ink-abyss:    oklch(15% 0.04 250);
  --ink-deep:     oklch(20% 0.045 248);
  --ink-mid:      oklch(28% 0.04 248);
  --ink-veil:     oklch(36% 0.035 248);
  --ink-fog:      oklch(70% 0.02 248);
  --ink-spectral: oklch(82% 0.018 90);
  --ink-pearl:    oklch(96% 0.012 88);

  /* 주 액센트 — 황금/황동 */
  --brass:        oklch(78% 0.13 75);
  --brass-bright: oklch(86% 0.16 78);
  --brass-deep:   oklch(56% 0.13 65);
  --brass-glow:   oklch(82% 0.16 75 / 28%);

  /* 보조 액센트 — 시안/오로라 */
  --aurora:       oklch(82% 0.13 195);
  --aurora-deep:  oklch(58% 0.13 200);
  --aurora-glow:  oklch(82% 0.13 195 / 22%);

  /* 위험/경고 */
  --coral:        oklch(72% 0.17 25);
  --coral-glow:   oklch(72% 0.17 25 / 22%);

  /* 표면 */
  --surface-glass:       oklch(28% 0.04 248 / 60%);
  --surface-glass-strong: oklch(32% 0.04 248 / 78%);
  --surface-pillar:      oklch(22% 0.05 248 / 86%);
  --surface-rim:         oklch(64% 0.04 248 / 24%);
  --surface-rim-strong:  oklch(72% 0.05 248 / 38%);

  /* 그림자 */
  --shadow-soft:     0 1px 0 0 oklch(96% 0.01 90 / 6%) inset, 0 18px 38px -22px oklch(0% 0 0 / 70%);
  --shadow-floating: 0 1px 0 0 oklch(96% 0.01 90 / 8%) inset, 0 32px 60px -28px oklch(0% 0 0 / 80%);
  --shadow-anchor:   0 0 0 1px oklch(78% 0.13 75 / 16%), 0 12px 32px -16px oklch(78% 0.13 75 / 30%);

  /* 간격 */
  --radius-xs: 8px; --radius-sm: 10px; --radius-md: 14px;
  --radius-lg: 18px; --radius-xl: 24px;

  /* 애니메이션 */
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-glide:  cubic-bezier(0.4, 0.14, 0.2, 1);
  --duration-fast: 140ms;
  --duration-base: 220ms;
  --duration-slow: 360ms;

  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-body:    "Manrope", ui-sans-serif, system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  background: var(--ink-abyss);
  color: var(--ink-pearl);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(900px 720px at 8% 4%,   oklch(48% 0.12 200 / 22%), transparent 60%),
    radial-gradient(820px 700px at 92% 96%, oklch(52% 0.13 60  / 18%), transparent 62%),
    radial-gradient(560px 520px at 70% 18%, oklch(50% 0.14 290 / 12%), transparent 68%),
    var(--ink-abyss);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.96 0 0 0 0 0.93 0 0 0 0 0.86 0 0 0 0.4 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
  background-size: 220px 220px;
  mix-blend-mode: overlay;
  opacity: 0.45;
}

/* ───── Layout ───── */
.shell {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}
@media (max-width: 720px) {
  .shell { padding: 0 20px; }
}

/* ───── Top nav ───── */
.topnav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  background: oklch(15% 0.04 250 / 72%);
  border-bottom: 1px solid var(--surface-rim);
}
.topnav-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-pearl);
  text-decoration: none;
}
.brand-mark {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 8px;
  background: linear-gradient(160deg, oklch(78% 0.13 75 / 30%), oklch(82% 0.13 195 / 16%));
  border: 1px solid oklch(78% 0.13 75 / 40%);
  color: var(--brass-bright);
}
.nav-links {
  display: flex; gap: 28px; align-items: center;
}
.nav-links a {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-fog);
  text-decoration: none;
  transition: color var(--duration-fast) var(--ease-spring);
}
.nav-links a:hover { color: var(--ink-pearl); }
.nav-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--surface-rim-strong);
  background: var(--surface-glass);
  color: var(--ink-pearl);
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em;
  text-decoration: none;
  transition: all var(--duration-fast) var(--ease-spring);
}
.nav-cta:hover {
  border-color: var(--brass);
  color: var(--brass-bright);
  transform: translateY(-1px);
}
@media (max-width: 720px) {
  .nav-links { display: none; }
  .topnav .nav-cta { padding: 6px 12px; }
}

/* ───── Common building blocks ───── */
.card {
  background: var(--surface-glass);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--surface-rim);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-soft);
  position: relative; overflow: hidden;
}
.card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg,
    transparent,
    oklch(78% 0.13 75 / 50%) 30%,
    oklch(82% 0.13 195 / 40%) 70%,
    transparent);
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--brass-bright);
}

.hero-title {
  font-family: var(--font-display);
  font-style: italic; font-weight: 300;
  font-size: clamp(56px, 7.2vw, 96px);
  letter-spacing: -0.03em; line-height: 1.02;
  background: linear-gradient(180deg, var(--ink-pearl) 30%, oklch(75% 0.04 90));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  margin: 0;
}

.section-title {
  font-family: var(--font-display);
  font-weight: 500; font-size: clamp(28px, 3.6vw, 44px);
  letter-spacing: -0.02em; color: var(--ink-pearl);
  margin: 0;
}

.divider {
  width: 64px; height: 2px; border-radius: 999px;
  background: linear-gradient(90deg, var(--brass), var(--aurora));
  margin: 8px 0 16px;
}

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 20px;
  border: 1px solid oklch(78% 0.13 75 / 50%);
  background: linear-gradient(180deg, oklch(78% 0.13 75 / 18%), oklch(78% 0.13 75 / 8%)),
              oklch(28% 0.04 248 / 60%);
  border-radius: var(--radius-md);
  color: var(--brass-bright);
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow-anchor);
  transition: transform var(--duration-fast) var(--ease-spring),
              box-shadow var(--duration-base) var(--ease-spring),
              border-color var(--duration-fast) var(--ease-spring);
  cursor: pointer; text-decoration: none;
}
.btn-primary:hover {
  transform: translateY(-2px);
  border-color: var(--brass);
  box-shadow: 0 0 0 1px oklch(78% 0.13 75 / 30%),
              0 18px 40px -16px oklch(78% 0.13 75 / 40%);
}
.btn-secondary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 20px;
  border: 1px solid var(--surface-rim-strong);
  background: var(--surface-glass);
  border-radius: var(--radius-md);
  color: var(--ink-pearl);
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: none;
  transition: all var(--duration-fast) var(--ease-spring);
}
.btn-secondary:hover {
  transform: translateY(-2px);
  border-color: var(--aurora);
  color: var(--aurora);
}

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 999px;
  background: oklch(28% 0.04 248 / 60%);
  border: 1px solid var(--surface-rim);
  color: var(--ink-fog);
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em;
}
.chip-brass { background: oklch(78% 0.13 75 / 12%); border-color: oklch(78% 0.13 75 / 35%); color: var(--brass-bright); }
.chip-aurora { background: oklch(82% 0.13 195 / 12%); border-color: oklch(82% 0.13 195 / 35%); color: var(--aurora); }
.chip-coral  { background: oklch(72% 0.17 25 / 12%); border-color: oklch(72% 0.17 25 / 35%); color: var(--coral); }

/* ───── Animations ───── */
@keyframes codex-rise {
  from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}
@keyframes codex-glow {
  0%, 100% { opacity: 0.55; }
  50%       { opacity: 1; }
}
@keyframes codex-pop {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes spin-slow {
  to { transform: rotate(360deg); }
}
@keyframes radar-sweep {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.5); opacity: 0.5; }
}

.section { animation: codex-rise 720ms var(--ease-spring) both; }
.section:nth-of-type(1) { animation-delay: 0ms; }
.section:nth-of-type(2) { animation-delay: 80ms; }
.section:nth-of-type(3) { animation-delay: 160ms; }
.section:nth-of-type(4) { animation-delay: 240ms; }

/* ───── HERO ───── */
.hero {
  position: relative;
  padding: 96px 0 80px;
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: 64px;
  align-items: center;
}
.hero-grid > * { min-width: 0; }
@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .hero { padding: 64px 0 56px; }
}
.hero-eyebrow {
  display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
}
.hero-eyebrow .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--brass-bright);
  box-shadow: 0 0 12px var(--brass-glow);
  animation: pulse-dot 2.4s var(--ease-glide) infinite;
}
.hero-sub {
  font-family: var(--font-display);
  font-style: italic; font-weight: 300;
  font-size: clamp(20px, 2.2vw, 26px);
  color: var(--ink-spectral);
  margin: 22px 0 12px;
  letter-spacing: -0.01em;
  line-height: 1.4;
  max-width: 560px;
}
.hero-desc {
  font-size: 16px; line-height: 1.7;
  color: var(--ink-fog);
  max-width: 540px;
  margin: 0 0 32px;
}
.hero-actions {
  display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
}
.hero-meta {
  display: flex; gap: 20px; flex-wrap: wrap; margin-top: 36px;
  padding-top: 28px;
  border-top: 1px solid var(--surface-rim);
}
.hero-meta-item .label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-fog);
  margin-bottom: 6px;
}
.hero-meta-item .value {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 22px; color: var(--ink-pearl);
}
.hero-meta-item .value em { color: var(--brass-bright); font-style: italic; }

/* Hero diagram — radial command structure */
.hero-diagram {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 480px;
  margin: 0 auto;
}
.hero-diagram-ring {
  position: absolute; inset: 0;
  border: 1px dashed oklch(78% 0.13 75 / 30%);
  border-radius: 50%;
}
.hero-diagram-ring.r2 { inset: 14%; border-color: oklch(82% 0.13 195 / 22%); }
.hero-diagram-ring.r3 { inset: 28%; border-color: oklch(72% 0.05 248 / 22%); }
.hero-diagram-sweep {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: conic-gradient(from 0deg,
    transparent 0deg,
    oklch(78% 0.13 75 / 0%) 280deg,
    oklch(78% 0.13 75 / 24%) 350deg,
    transparent 360deg);
  animation: radar-sweep 8s linear infinite;
  pointer-events: none;
}
.hero-diagram-center {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 38%; aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 40%, oklch(78% 0.13 75 / 28%), transparent 70%),
    var(--surface-pillar);
  border: 1px solid oklch(78% 0.13 75 / 38%);
  display: grid; place-items: center;
  text-align: center;
  box-shadow: var(--shadow-anchor);
}
.hero-diagram-center .role {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--brass-bright);
  margin-bottom: 4px;
}
.hero-diagram-center .name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(16px, 2vw, 22px);
  color: var(--ink-pearl);
  line-height: 1.1;
}
.hero-diagram-node {
  position: absolute;
  width: 72px; height: 72px;
  margin-left: -36px; margin-top: -36px;
  border-radius: 50%;
  background: var(--surface-pillar);
  border: 1px solid var(--surface-rim-strong);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-family: var(--font-mono);
  color: var(--ink-pearl);
  box-shadow: var(--shadow-soft);
  transition: all var(--duration-base) var(--ease-spring);
  text-align: center;
  padding: 4px;
}
.hero-diagram-node .node-label {
  font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--node-color, var(--brass-bright));
}
.hero-diagram-node .node-name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 11px; color: var(--ink-spectral);
  letter-spacing: 0; line-height: 1;
}
.hero-diagram-node:hover {
  border-color: var(--brass);
  transform: scale(1.1);
}
.hero-diagram-node::after {
  content: ""; position: absolute;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--node-color, var(--brass));
  bottom: -4px; right: -4px;
  box-shadow: 0 0 10px var(--node-color, var(--brass-glow));
}

/* ───── Section base ───── */
section {
  padding: 80px 0;
  position: relative;
}
@media (max-width: 720px) {
  section { padding: 56px 0; }
}
.section-head {
  display: flex; flex-direction: column; align-items: flex-start;
  margin-bottom: 48px;
  max-width: 720px;
}
.section-head .lede {
  margin-top: 14px;
  color: var(--ink-fog);
  font-size: 17px;
  line-height: 1.65;
}

/* ───── Hierarchy section ───── */
.hierarchy {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 860px) {
  .hierarchy { grid-template-columns: 1fr; }
}
.tier {
  padding: 28px;
  border-radius: var(--radius-xl);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  position: relative;
  transition: all var(--duration-fast) var(--ease-spring);
}
.tier:hover {
  transform: translateY(-2px);
  border-color: oklch(78% 0.13 75 / 40%);
}
.tier-rank {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--brass-bright);
  margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.tier-rank::before {
  content: ""; width: 24px; height: 1px;
  background: linear-gradient(90deg, var(--brass), transparent);
}
.tier-role {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 32px; color: var(--ink-pearl);
  letter-spacing: -0.02em; line-height: 1.1;
  margin-bottom: 6px;
}
.tier-en {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--ink-fog); letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.tier-desc {
  color: var(--ink-spectral); font-size: 14px; line-height: 1.6;
}
.tier-arrow {
  position: absolute; top: 50%; right: -16px; transform: translateY(-50%);
  width: 28px; height: 28px;
  display: grid; place-items: center;
  background: var(--ink-abyss);
  border-radius: 50%;
  border: 1px solid var(--surface-rim-strong);
  color: var(--brass);
  font-size: 14px;
  z-index: 2;
}
@media (max-width: 860px) {
  .tier-arrow { right: 50%; top: auto; bottom: -18px; transform: translateX(50%) rotate(90deg); }
}

/* ───── CLI Backends grid ───── */
.cli-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 860px) { .cli-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .cli-grid { grid-template-columns: 1fr; } }
.cli {
  padding: 22px 22px 20px;
  border-radius: var(--radius-lg);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  position: relative; overflow: hidden;
  transition: all var(--duration-fast) var(--ease-spring);
}
.cli::before {
  content: ""; position: absolute; left: 22px; top: 0; width: 28px; height: 2px;
  background: linear-gradient(90deg, var(--cli-color, var(--brass)), transparent);
}
.cli:hover {
  transform: translateY(-2px);
  border-color: oklch(78% 0.13 75 / 40%);
  background: var(--surface-glass-strong);
}
.cli-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.cli-num {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  color: var(--ink-fog);
}
.cli-vendor {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cli-color, var(--brass-bright));
}
.cli-name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 22px; color: var(--ink-pearl); letter-spacing: -0.01em;
  line-height: 1.2;
  margin-bottom: 8px;
}
.cli-tag {
  font-size: 13px; color: var(--ink-fog); line-height: 1.5;
}

/* ───── Captains ───── */
.captains-wrap {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 960px) {
  .captains-wrap { grid-template-columns: 1fr; }
}
.captain-list {
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px;
  border-radius: var(--radius-xl);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  position: sticky; top: 80px;
}
@media (max-width: 960px) {
  .captain-list { position: static; flex-direction: row; flex-wrap: wrap; }
  .captain-list-item { flex: 1 1 140px; }
}
.captain-list-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  text-align: left;
  transition: all var(--duration-fast) var(--ease-spring);
  font-family: inherit; color: inherit;
}
.captain-list-item:hover {
  background: oklch(28% 0.04 248 / 50%);
  transform: translateX(2px);
}
.captain-list-item:hover .captain-list-name { color: var(--ink-pearl); }
.captain-list-item.active {
  background: var(--surface-glass-strong);
  border-color: oklch(78% 0.13 75 / 30%);
  box-shadow: var(--shadow-anchor);
}
.captain-list-item.active .captain-list-name { color: var(--ink-pearl); }
.captain-list-item.active .captain-list-role { color: var(--brass-bright); }
.captain-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--cap-color);
  box-shadow: 0 0 10px var(--cap-color);
  flex-shrink: 0;
}
.captain-list-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.captain-list-name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 20px; color: var(--ink-spectral);
  letter-spacing: -0.01em;
  transition: color var(--duration-fast);
}
.captain-list-role {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--ink-fog);
  transition: color var(--duration-fast);
}

.captain-detail {
  padding: 36px;
  border-radius: var(--radius-xl);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  box-shadow: var(--shadow-soft);
  position: relative;
  overflow: hidden;
  min-height: 420px;
}
.captain-detail::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--cap-color, var(--brass)), transparent 80%);
}
@media (max-width: 540px) { .captain-detail { padding: 24px; } }
.captain-detail-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 24px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.captain-detail-title-block { flex: 1; min-width: 0; }
.captain-id {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--cap-color, var(--brass-bright));
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.captain-id::after {
  content: ""; flex: 1; height: 1px; max-width: 40px;
  background: linear-gradient(90deg, var(--cap-color, var(--brass)), transparent);
}
.captain-name {
  font-family: var(--font-display); font-style: italic; font-weight: 300;
  font-size: clamp(40px, 5.6vw, 64px);
  color: var(--ink-pearl); letter-spacing: -0.03em;
  line-height: 1; margin: 0 0 8px;
}
.captain-role {
  font-family: var(--font-display); font-weight: 500;
  font-size: 16px;
  color: var(--ink-spectral);
  letter-spacing: 0.02em;
  margin-bottom: 0;
}
.captain-cli-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: oklch(28% 0.04 248 / 70%);
  border: 1px solid var(--surface-rim-strong);
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  color: var(--ink-spectral);
  white-space: nowrap;
}
.captain-cli-badge .ind {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cap-color);
  box-shadow: 0 0 8px var(--cap-color);
}
.captain-body {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
}
.captain-mission {
  font-family: var(--font-display); font-style: italic; font-weight: 300;
  font-size: 22px; line-height: 1.45;
  color: var(--ink-spectral);
  letter-spacing: -0.005em;
  padding: 20px 24px;
  border-left: 2px solid var(--cap-color);
  background: oklch(20% 0.045 248 / 50%);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
}
.captain-resp-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-fog);
  margin-bottom: 14px;
}
.captain-resp-list {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.captain-resp-list li {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  background: oklch(28% 0.04 248 / 40%);
  border: 1px solid var(--surface-rim);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--ink-spectral);
  transition: all var(--duration-fast) var(--ease-spring);
}
.captain-resp-list li:hover {
  transform: translateX(3px);
  color: var(--ink-pearl);
  border-color: var(--cap-color);
}
.captain-resp-list li::before {
  content: "▸";
  color: var(--cap-color);
  font-size: 12px;
  margin-top: 2px;
}

/* ───── Phases (7-step protocol) ───── */
.phases-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: stretch;
}
@media (max-width: 960px) { .phases-wrap { grid-template-columns: 1fr; } }
.phase-rail {
  display: flex; flex-direction: column; gap: 0;
  padding: 24px 0;
  position: relative;
}
.phase-rail::before {
  content: ""; position: absolute; left: 23px; top: 30px; bottom: 30px;
  width: 1px;
  background: linear-gradient(180deg,
    var(--surface-rim) 0%,
    oklch(78% 0.13 75 / 40%) 50%,
    var(--surface-rim) 100%);
}
.phase-step {
  display: flex; align-items: flex-start; gap: 16px;
  padding: 14px 0;
  cursor: pointer;
  background: transparent; border: none; text-align: left;
  font-family: inherit; color: inherit;
  position: relative;
  transition: all var(--duration-fast) var(--ease-spring);
}
.phase-step:hover .phase-step-num { border-color: var(--brass); color: var(--brass-bright); }
.phase-step:hover .phase-step-title { color: var(--ink-pearl); }
.phase-step.active .phase-step-num {
  background: oklch(78% 0.13 75 / 16%);
  border-color: var(--brass);
  color: var(--brass-bright);
  box-shadow: 0 0 0 4px oklch(78% 0.13 75 / 8%);
}
.phase-step.active .phase-step-title {
  color: var(--ink-pearl);
  font-weight: 500;
}
.phase-step-num {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--ink-deep);
  border: 1px solid var(--surface-rim-strong);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 14px; font-weight: 600;
  color: var(--ink-fog);
  flex-shrink: 0;
  z-index: 1;
  transition: all var(--duration-base) var(--ease-spring);
}
.phase-step-body { padding-top: 10px; min-width: 0; flex: 1; }
.phase-step-title {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 20px; color: var(--ink-spectral);
  letter-spacing: -0.01em;
  line-height: 1.2;
  transition: color var(--duration-fast);
}
.phase-step-tag {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-fog);
  margin-top: 4px;
}
.phase-step.required .phase-step-tag { color: var(--coral); }
.phase-step.conditional .phase-step-tag { color: var(--aurora); }

.phase-detail {
  padding: 36px;
  border-radius: var(--radius-xl);
  background: var(--surface-glass-strong);
  border: 1px solid var(--surface-rim);
  box-shadow: var(--shadow-floating);
  position: relative; overflow: hidden;
}
.phase-detail::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brass), var(--aurora), transparent);
}
@media (max-width: 540px) { .phase-detail { padding: 24px; } }
.phase-detail-num {
  font-family: var(--font-display); font-style: italic; font-weight: 300;
  font-size: 80px; line-height: 1; color: oklch(78% 0.13 75 / 30%);
  letter-spacing: -0.04em;
  position: absolute; top: 20px; right: 28px;
  pointer-events: none;
}
.phase-detail-eyebrow {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--brass-bright);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.phase-detail-title {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: clamp(28px, 3.4vw, 38px);
  color: var(--ink-pearl); letter-spacing: -0.02em;
  line-height: 1.1; margin: 0 0 20px;
}
.phase-detail-desc {
  color: var(--ink-spectral); font-size: 15px; line-height: 1.65;
  margin-bottom: 24px;
}
.phase-detail-points {
  display: flex; flex-direction: column; gap: 10px;
}
.phase-detail-point {
  padding: 14px 16px;
  background: oklch(20% 0.045 248 / 70%);
  border: 1px solid var(--surface-rim);
  border-radius: var(--radius-sm);
  font-size: 14px; line-height: 1.5;
  color: var(--ink-spectral);
  display: flex; align-items: flex-start; gap: 12px;
}
.phase-detail-point .pt-marker {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  color: var(--brass-bright);
  letter-spacing: 0.1em;
  flex-shrink: 0;
  padding-top: 2px;
}
.phase-detail-point strong {
  color: var(--ink-pearl);
  font-weight: 600;
}

/* ───── Standing Orders ───── */
.orders-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 860px) { .orders-grid { grid-template-columns: 1fr; } }
.order {
  padding: 28px;
  border-radius: var(--radius-xl);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  position: relative;
  overflow: hidden;
  transition: all var(--duration-fast) var(--ease-spring);
}
.order:hover {
  transform: translateY(-2px);
  border-color: oklch(82% 0.13 195 / 30%);
}
.order::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--aurora), transparent);
  opacity: 0.55;
}
.order-glow {
  position: absolute; right: -40px; top: -40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(82% 0.13 195 / 22%), transparent 70%);
  pointer-events: none;
  animation: codex-glow 6s var(--ease-glide) infinite;
}
.order-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: oklch(82% 0.13 195 / 14%);
  border: 1px solid oklch(82% 0.13 195 / 36%);
  color: var(--aurora);
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 18px;
}
.order-status .live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--aurora);
  box-shadow: 0 0 8px var(--aurora);
  animation: pulse-dot 1.8s var(--ease-glide) infinite;
}
.order-name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 26px; color: var(--ink-pearl);
  letter-spacing: -0.02em; line-height: 1.15;
  margin-bottom: 10px;
}
.order-name span {
  font-family: var(--font-mono); font-style: normal; font-weight: 500;
  font-size: 12px; color: var(--ink-fog);
  letter-spacing: 0.08em;
  display: block; margin-top: 6px;
}
.order-desc {
  color: var(--ink-spectral); font-size: 14px; line-height: 1.6;
}

/* ───── Differentiators ───── */
.diff-list {
  display: flex; flex-direction: column;
  border-radius: var(--radius-xl);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  overflow: hidden;
}
.diff-row {
  display: grid;
  grid-template-columns: 80px 1fr 2fr;
  gap: 28px;
  padding: 28px 32px;
  border-bottom: 1px solid var(--surface-rim);
  align-items: start;
  transition: background var(--duration-fast);
}
.diff-row:last-child { border-bottom: none; }
.diff-row:hover { background: oklch(28% 0.04 248 / 30%); }
@media (max-width: 720px) {
  .diff-row { grid-template-columns: 1fr; gap: 12px; padding: 22px 20px; }
}
.diff-num {
  font-family: var(--font-display); font-style: italic; font-weight: 300;
  font-size: 56px; line-height: 1;
  color: transparent;
  background: linear-gradient(180deg, var(--brass-bright), var(--brass-deep));
  -webkit-background-clip: text; background-clip: text;
  letter-spacing: -0.03em;
}
.diff-name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 24px; color: var(--ink-pearl);
  letter-spacing: -0.02em; line-height: 1.15;
}
.diff-name span {
  display: block;
  font-family: var(--font-mono); font-style: normal; font-weight: 500;
  font-size: 11px; color: var(--brass-bright);
  letter-spacing: 0.16em; text-transform: uppercase;
  margin-bottom: 6px;
}
.diff-body {
  color: var(--ink-spectral); font-size: 15px; line-height: 1.65;
}

/* ───── Comparison ───── */
.compare-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 960px) { .compare-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .compare-grid { grid-template-columns: 1fr; } }
.compare-col {
  padding: 24px;
  border-radius: var(--radius-lg);
  background: var(--surface-glass);
  border: 1px solid var(--surface-rim);
  position: relative;
  transition: all var(--duration-fast) var(--ease-spring);
}
.compare-col.us {
  background: linear-gradient(180deg, oklch(78% 0.13 75 / 12%), oklch(78% 0.13 75 / 4%)),
              var(--surface-glass-strong);
  border-color: oklch(78% 0.13 75 / 40%);
  box-shadow: var(--shadow-anchor);
}
.compare-col:hover { transform: translateY(-2px); }
.compare-cat {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-fog);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--surface-rim);
}
.compare-col.us .compare-cat { color: var(--brass-bright); border-color: oklch(78% 0.13 75 / 40%); }
.compare-name {
  font-family: var(--font-display); font-style: italic; font-weight: 400;
  font-size: 22px; color: var(--ink-pearl);
  letter-spacing: -0.01em; line-height: 1.2;
  margin-bottom: 14px;
}
.compare-list {
  list-style: none; padding: 0; margin: 0 0 14px 0;
  display: flex; flex-direction: column; gap: 6px;
}
.compare-list li {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--ink-fog);
  padding-left: 14px; position: relative;
}
.compare-list li::before {
  content: "·";
  position: absolute; left: 4px; top: -1px;
  color: var(--brass);
}
.compare-verdict {
  font-size: 13px; line-height: 1.5;
  color: var(--ink-spectral);
  padding-top: 12px;
  border-top: 1px dashed var(--surface-rim);
}
.compare-col.us .compare-name { color: var(--brass-bright); }

/* ───── Closer / footer ───── */
.closer {
  padding: 80px 0 100px;
  text-align: center;
}
.closer-card {
  padding: 64px 48px;
  border-radius: var(--radius-xl);
  background:
    radial-gradient(ellipse 60% 60% at 50% 0%, oklch(78% 0.13 75 / 14%), transparent 60%),
    var(--surface-glass-strong);
  border: 1px solid var(--surface-rim-strong);
  box-shadow: var(--shadow-floating);
  position: relative;
  overflow: hidden;
}
.closer-card::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brass), var(--aurora), transparent);
}
@media (max-width: 720px) { .closer-card { padding: 44px 24px; } }
.closer-eyebrow {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--brass-bright);
  margin-bottom: 18px;
}
.closer-title {
  font-family: var(--font-display); font-style: italic; font-weight: 300;
  font-size: clamp(36px, 5.4vw, 60px);
  letter-spacing: -0.03em; line-height: 1.05;
  color: var(--ink-pearl);
  margin: 0 0 20px;
}
.closer-sub {
  color: var(--ink-fog); font-size: 17px;
  max-width: 540px; margin: 0 auto 36px;
  line-height: 1.6;
}
.closer-actions {
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
}
.footer {
  padding: 32px 0 48px;
  border-top: 1px solid var(--surface-rim);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
  color: var(--ink-fog);
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.06em;
}
.footer-meta { display: flex; gap: 18px; flex-wrap: wrap; }

/* ───── Code block ───── */
.code-block {
  font-family: var(--font-mono);
  font-size: 13px;
  background: oklch(15% 0.04 250 / 80%);
  border: 1px solid var(--surface-rim);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  color: var(--ink-spectral);
  overflow-x: auto;
  white-space: nowrap;
}
.code-block .pr { color: var(--brass-bright); }
.code-block .cm { color: var(--ink-fog); }
.code-block .ar { color: var(--aurora); }

/* ───── Reduced motion ───── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ───── Focus styles ───── */
:focus-visible {
  outline: 2px solid var(--brass-bright);
  outline-offset: 3px;
  border-radius: 4px;
}
button, a { -webkit-tap-highlight-color: transparent; }
</style>
</head>
