<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fleet-harness — every coding agent, one console, any screen</title>
<meta name="description" content="Fleet runs your coding agents as live, server-owned sessions on your machine — and lets you command them from a browser, a desktop window, or the phone in your pocket." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────
   Fleet docs — 페이지가 곧 콘솔이다.
   팔레트·모티프는 제품의 Instrument 다크 테마에서 그대로 가져온다.
   ───────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;

  /* Instrument theme, lifted from the product */
  --abyss:  #0e1014;   /* page ground */
  --hull:   #14171d;   /* raised panel */
  --deck:   #1c1f26;   /* card surface */
  --line:   #2b2e36;   /* hairline */
  --line-strong: #3a3d45;
  --pearl:  #f1eee8;   /* primary text */
  --bone:   #d9d5cd;   /* secondary text */
  --fog:    #8b8880;   /* muted */
  --brass:  #d3b578;   /* the accent */
  --brass-deep: #a88c52;
  --teal:   #8fd8d2;   /* live / connected */
  --ember:  #e6aa87;   /* caution */

  --font-display: "Instrument Serif", Georgia, serif;
  --font-body: "Manrope", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --shell: 1140px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  background: var(--abyss);
  color: var(--bone);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: rgba(211, 181, 120, .28); color: var(--pearl); }

.shell { max-width: var(--shell); margin: 0 auto; padding: 0 28px; }

/* 한국어 제목·리드는 어절 단위로만 줄바꿈한다 */
:lang(ko) .hero-title, :lang(ko) .section-title, :lang(ko) .closer-title,
:lang(ko) .thesis-line, :lang(ko) .lede, :lang(ko) .hero-sub { word-break: keep-all; }

a { color: inherit; text-decoration: none; }

/* ── grain + vignette ground ─────────────────────────────── */
.ground {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1100px 520px at 50% -160px, rgba(211,181,120,.055), transparent 68%),
    radial-gradient(900px 600px at 88% 12%, rgba(143,216,210,.035), transparent 62%),
    var(--abyss);
}
.ground::after {
  content: ""; position: absolute; inset: 0; opacity: .5;
  background-image: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.006) 2px 4px);
}

/* ── top nav ─────────────────────────────────────────────── */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  background: rgba(14, 16, 20, .78);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(43, 46, 54, .8);
}
.topnav-inner { display: flex; align-items: center; gap: 28px; height: 58px; }
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-weight: 600; font-size: 15px; color: var(--pearl);
  letter-spacing: .02em;
}
.brand .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal); box-shadow: 0 0 8px var(--teal);
}
.brand .muted { color: var(--fog); font-weight: 400; }
.nav-links { display: flex; gap: 22px; margin-left: auto; }
.nav-links a {
  font-size: 13.5px; font-weight: 500; color: var(--fog);
  transition: color 160ms var(--ease);
}
.nav-links a:hover, .nav-links a:focus-visible { color: var(--pearl); }
.nav-side { display: flex; align-items: center; gap: 14px; }
.lang-flip {
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em;
  color: var(--fog); background: none; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; cursor: pointer;
  transition: color 160ms var(--ease), border-color 160ms var(--ease);
}
.lang-flip:hover, .lang-flip:focus-visible { color: var(--brass); border-color: var(--brass-deep); }
.nav-cta {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; color: #17140e;
  background: var(--brass); border-radius: 999px; padding: 7px 15px;
  transition: filter 160ms var(--ease);
}
.nav-cta:hover, .nav-cta:focus-visible { filter: brightness(1.08); }
@media (max-width: 860px) { .nav-links { display: none; } }

:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 4px; }

/* ── hero ────────────────────────────────────────────────── */
.hero { padding: 148px 0 0; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--brass);
}
.hero-eyebrow .pulse {
  width: 7px; height: 7px; border-radius: 50%; background: var(--teal);
  box-shadow: 0 0 10px var(--teal); animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.hero-title {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(44px, 7vw, 78px); line-height: 1.04; letter-spacing: -0.01em;
  color: var(--pearl); margin: 22px 0 26px; max-width: 21ch;
}
.hero-title em { font-style: italic; color: var(--brass); }
.hero-sub { font-size: 18px; max-width: 58ch; color: var(--bone); }
.hero-sub strong { color: var(--pearl); font-weight: 600; }

.hero-row {
  display: grid; grid-template-columns: minmax(0, 1fr) 400px;
  gap: 48px; align-items: end; margin-top: 44px;
}
@media (max-width: 960px) { .hero-row { grid-template-columns: 1fr; } }

.hero-meta { display: flex; flex-wrap: wrap; gap: 26px 34px; padding-bottom: 6px; }
.hero-meta .item .k {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--fog); margin-bottom: 4px;
}
.hero-meta .item .v { font-size: 14.5px; font-weight: 600; color: var(--pearl); }
.hero-meta .item .v em { font-style: normal; color: var(--brass); }

/* boot terminal — the signature moment */
.boot {
  background: #111318; border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: 0 24px 60px -30px rgba(0,0,0,.8);
  overflow: hidden;
}
.boot-bar {
  display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px;
  background: var(--deck); border-bottom: 1px solid var(--line);
}
.boot-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); }
.boot-bar i:first-child { background: #a05b52; }
.boot-bar span {
  margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--fog);
}
.boot-body {
  padding: 16px 18px 18px; font-family: var(--font-mono); font-size: 13px;
  line-height: 1.8; min-height: 148px; white-space: pre-wrap; word-break: break-all;
  color: var(--bone);
}
.boot-body .p { color: var(--teal); }
.boot-body .c { color: var(--pearl); font-weight: 600; }
.boot-body .d { color: var(--fog); }
.boot-body .caret {
  display: inline-block; width: 7px; height: 15px; margin-left: 1px;
  background: var(--brass); vertical-align: text-bottom;
  animation: caret 1.1s steps(1) infinite;
}
@keyframes caret { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .boot-body .caret { animation: none; }
  .hero-eyebrow .pulse { animation: none; }
}

/* the dock — framed screenshot with the product's corner brackets */
.dock { position: relative; margin-top: 54px; }
.dock .plate {
  border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
  background: var(--hull);
  box-shadow: 0 50px 120px -45px rgba(0,0,0,.85), 0 0 0 1px rgba(211,181,120,.05);
}
.dock img { width: 100%; display: block; }
.dock .corner {
  position: absolute; width: 26px; height: 26px; pointer-events: none;
  border: 2px solid var(--brass); opacity: .9;
}
.dock .corner.tl { top: -7px; left: -7px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
.dock .corner.tr { top: -7px; right: -7px; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
.dock .corner.bl { bottom: -7px; left: -7px; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
.dock .corner.br { bottom: -7px; right: -7px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
.dock figcaption {
  margin-top: 14px; text-align: center;
  font-family: var(--font-mono); font-size: 12px; color: var(--fog);
}
.dock figcaption b { color: var(--brass); font-weight: 500; }

/* ── thesis strip ────────────────────────────────────────── */
.thesis { padding: 110px 0 24px; }
.thesis-line {
  font-family: var(--font-display); font-size: clamp(26px, 3.6vw, 40px);
  line-height: 1.25; color: var(--pearl); max-width: 30ch;
}
.thesis-line em { font-style: italic; color: var(--brass); }
.screens { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.screen-chip {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12.5px; color: var(--bone);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  background: rgba(28, 31, 38, .5);
}
.screen-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
.screen-chip.soon i { background: var(--ember); }
.screen-chip .tag { color: var(--fog); }

/* ── section scaffolding ─────────────────────────────────── */
.section { padding: 104px 0 0; }
.section-head { max-width: 700px; margin-bottom: 44px; }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--brass);
}
.section-title {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(32px, 4.6vw, 50px); line-height: 1.08; color: var(--pearl);
  margin: 14px 0 16px;
}
.section-title em { font-style: italic; color: var(--brass); }
.lede { font-size: 16.5px; color: var(--bone); }
.lede strong { color: var(--pearl); font-weight: 600; }

/* shot frame reused in sections */
.shot {
  border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
  background: var(--hull); box-shadow: 0 36px 90px -40px rgba(0,0,0,.8);
}
.shot img { width: 100%; display: block; }
.shot-cap {
  margin-top: 12px; font-family: var(--font-mono); font-size: 12px; color: var(--fog);
}

/* ── gateway ─────────────────────────────────────────────── */
.gateway-grid {
  display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 40px; align-items: start;
}
@media (max-width: 960px) { .gateway-grid { grid-template-columns: 1fr; } }
.provider-tabs { display: flex; flex-direction: column; gap: 8px; }
.provider-tab {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: none; border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 13px 16px; cursor: pointer; color: var(--bone);
  font-family: var(--font-body); font-size: 14px;
  transition: border-color 180ms var(--ease), background 180ms var(--ease);
}
.provider-tab:hover { border-color: var(--line-strong); }
.provider-tab[aria-selected="true"] {
  border-color: var(--brass-deep); background: rgba(211,181,120,.06);
}
.provider-tab .pd { width: 8px; height: 8px; border-radius: 50%; background: var(--pv, var(--brass)); flex: none; }
.provider-tab .nm { font-weight: 700; color: var(--pearl); }
.provider-tab .rl { display: block; font-size: 12.5px; color: var(--fog); }
.provider-detail {
  border: 1px solid var(--line); border-radius: var(--r-lg);
  background: var(--hull); padding: 26px 28px;
}
.provider-detail .cred {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em;
  color: var(--teal); border: 1px solid rgba(143,216,210,.3); border-radius: 999px;
  padding: 4px 11px; margin-bottom: 14px;
}
.provider-detail h3 {
  font-family: var(--font-display); font-weight: 400; font-size: 30px; color: var(--pearl);
}
.provider-detail .mission { color: var(--bone); font-size: 15px; margin: 12px 0 20px; }
.model-list { list-style: none; display: grid; gap: 9px; }
.model-list li {
  display: flex; align-items: baseline; gap: 11px;
  font-family: var(--font-mono); font-size: 13.5px; color: var(--bone);
}
.model-list li::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--pv, var(--brass)); flex: none; transform: translateY(-1px);
}
.gateway-note {
  margin-top: 22px; padding: 16px 18px; border-left: 2px solid var(--brass-deep);
  background: rgba(28,31,38,.5); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 14px; color: var(--bone);
}
.gateway-note b { color: var(--brass); font-weight: 700; }
.gateway-shot { margin-top: 44px; }

/* ── modes ───────────────────────────────────────────────── */
.mode-band {
  display: inline-flex; gap: 4px; padding: 5px;
  border: 1px solid var(--line); border-radius: 999px; background: rgba(17,19,24,.8);
  margin-bottom: 30px;
}
.mode-pill {
  font-family: var(--font-mono); font-size: 13px; color: var(--fog);
  background: none; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer;
  transition: color 160ms var(--ease), background 160ms var(--ease);
}
.mode-pill[aria-selected="true"] { color: var(--brass); background: rgba(211,181,120,.1); }
.mode-pill:hover { color: var(--pearl); }
.mode-split { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 960px) { .mode-split { grid-template-columns: 1fr; } }
.mode-copy h3 {
  font-family: var(--font-display); font-weight: 400; font-size: 32px; color: var(--pearl);
}
.mode-copy .kbd-row { margin: 10px 0 16px; }
.mode-copy p { font-size: 15px; color: var(--bone); }
kbd {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--bone);
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px;
  padding: 2px 7px; background: var(--deck);
}
.mode-points { margin-top: 20px; display: grid; gap: 12px; }
.mode-points .pt { display: flex; gap: 11px; font-size: 14px; color: var(--bone); }
.mode-points .pt i {
  width: 6px; height: 6px; border-radius: 50%; background: var(--teal);
  flex: none; margin-top: 8px;
}
.mode-points .pt b { color: var(--pearl); font-weight: 600; }

/* ── rail ────────────────────────────────────────────────── */
.rail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start; }
@media (max-width: 960px) { .rail-grid { grid-template-columns: 1fr; } }
.panel-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.panel-list .p {
  font-family: var(--font-mono); font-size: 13px; color: var(--bone);
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px;
  background: rgba(28,31,38,.45);
}
.panel-list .p span { color: var(--fog); }
.analyst {
  margin-top: 22px; padding: 18px 20px;
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--hull);
  font-size: 14px; color: var(--bone);
}
.analyst .t {
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--teal); margin-bottom: 8px;
}

/* ── anywhere ────────────────────────────────────────────── */
.anywhere-hero { margin-bottom: 46px; }
.pairing { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; align-items: start; }
@media (max-width: 960px) { .pairing { grid-template-columns: 1fr; } }
.steps { counter-reset: step; display: grid; gap: 0; }
.step {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px;
  padding: 20px 0; border-bottom: 1px solid var(--line);
}
.step:last-child { border-bottom: 0; }
.step .n {
  counter-increment: step;
  font-family: var(--font-mono); font-size: 13px; color: var(--brass);
  border: 1px solid var(--brass-deep); border-radius: 50%;
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
}
.step .n::before { content: counter(step, decimal-leading-zero); }
.step h4 { font-size: 15.5px; font-weight: 700; color: var(--pearl); margin-bottom: 5px; }
.step p { font-size: 14px; color: var(--bone); }
.step p b { color: var(--pearl); font-weight: 600; }
.guard-list { margin-top: 30px; display: grid; gap: 10px; }
.guard {
  display: flex; gap: 12px; align-items: baseline;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: rgba(28,31,38,.45); padding: 14px 17px; font-size: 14px; color: var(--bone);
}
.guard i {
  font-family: var(--font-mono); font-style: normal; font-size: 11px;
  letter-spacing: .08em; color: var(--ember); flex: none; transform: translateY(-1px);
}
.guard b { color: var(--pearl); font-weight: 600; }

/* ── doctrine ────────────────────────────────────────────── */
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 46px; }
@media (max-width: 860px) { .tiers { grid-template-columns: 1fr; } }
.tier {
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px 22px;
  background: rgba(28,31,38,.45);
}
.tier .k {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--fog); margin-bottom: 8px;
}
.tier h4 { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--pearl); margin-bottom: 7px; }
.tier p { font-size: 13.5px; color: var(--bone); }
.orders-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 960px) { .orders-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 680px) { .orders-grid { grid-template-columns: 1fr; } }
.order {
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 20px;
  background: var(--hull);
}
.order .live-row {
  display: flex; align-items: center; gap: 7px;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--teal); margin-bottom: 10px;
}
.order .live-row i { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); }
.order h4 { font-size: 15px; font-weight: 700; color: var(--pearl); margin-bottom: 3px; }
.order .kr { font-size: 12.5px; color: var(--fog); margin-bottom: 9px; }
.order p { font-size: 13px; color: var(--bone); }

/* ── compare ─────────────────────────────────────────────── */
.compare-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 960px) { .compare-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .compare-grid { grid-template-columns: 1fr; } }
.compare-col {
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px;
  background: rgba(28,31,38,.4); display: flex; flex-direction: column;
}
.compare-col.us { border-color: var(--brass-deep); background: rgba(211,181,120,.06); }
.compare-cat {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--fog); margin-bottom: 7px;
}
.compare-col.us .compare-cat { color: var(--brass); }
.compare-name { font-size: 14.5px; font-weight: 700; color: var(--pearl); margin-bottom: 13px; }
.compare-list { list-style: none; display: grid; gap: 7px; margin-bottom: 15px; }
.compare-list li {
  font-size: 13px; color: var(--bone); display: flex; gap: 9px; align-items: baseline;
}
.compare-list li::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--line-strong); flex: none; transform: translateY(-1px);
}
.compare-col.us .compare-list li::before { background: var(--brass); }
.compare-verdict {
  margin-top: auto; padding-top: 13px; border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--fog); font-style: italic;
}
.compare-col.us .compare-verdict { color: var(--bone); }

/* ── closer ──────────────────────────────────────────────── */
.closer { padding: 120px 0 0; }
.closer-card {
  border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  background:
    radial-gradient(700px 300px at 50% -80px, rgba(211,181,120,.09), transparent 70%),
